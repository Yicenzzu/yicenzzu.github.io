<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>紫禁城 · 故宫 3D</title>
<style>
  :root{
    --gold:#e8c97d;
    --gold-dim:rgba(232,201,125,.45);
    --ink:rgba(9,15,20,.55);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#0a1118}
  body{font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;-webkit-font-smoothing:antialiased}
  #app{position:fixed;inset:0}
  canvas{display:block;outline:none}

  .ui{position:fixed;inset:0;z-index:10;pointer-events:none;color:#f3e7c8;
      animation:uiIn 1.8s ease .6s both}
  @keyframes uiIn{from{opacity:0}to{opacity:1}}

  .brand{position:absolute;left:clamp(20px,4.2vw,58px);top:clamp(20px,4.2vw,50px);padding-right:70px}
  .brand .seal{
    position:absolute;right:6px;top:2px;width:42px;height:46px;
    display:flex;align-items:center;justify-content:center;
    background:#9c2a20;border:1px solid rgba(244,220,168,.55);
    color:#f6e2b6;font-family:"KaiTi","STKaiti","SimSun",serif;
    font-size:16px;line-height:1.05;letter-spacing:.08em;
    writing-mode:vertical-rl;text-orientation:upright;
    box-shadow:0 4px 18px rgba(0,0,0,.35);transform:rotate(3deg);
    opacity:.92;
  }
  .brand h1{
    font-family:"Songti SC","STSong","SimSun","Noto Serif SC",serif;
    font-weight:600;font-size:clamp(36px,5.2vw,68px);
    letter-spacing:.16em;line-height:1.05;
    color:#f5dfa6;
    text-shadow:0 1px 0 rgba(90,45,10,.65),0 6px 34px rgba(0,0,0,.65);
  }
  .brand .en{
    margin-top:12px;font-size:clamp(9px,0.9vw,11px);letter-spacing:.4em;
    color:rgba(242,229,198,.8);white-space:nowrap;
    text-shadow:0 2px 12px rgba(0,0,0,.65);
  }
  .brand .rule{width:clamp(130px,20vw,250px);height:1px;margin-top:14px;
    background:linear-gradient(90deg,rgba(232,201,125,.85),rgba(232,201,125,0));}
  .brand .meta{margin-top:11px;font-size:11px;letter-spacing:.22em;color:rgba(242,229,198,.58);text-shadow:0 2px 12px rgba(0,0,0,.7)}

  .hint{
    position:absolute;left:clamp(20px,4.2vw,58px);bottom:clamp(20px,4vw,38px);
    font-size:11px;letter-spacing:.22em;color:rgba(240,229,203,.6);
    display:flex;align-items:center;gap:12px;
  }
  .hint::before{content:"";width:26px;height:1px;background:rgba(232,201,125,.5)}

  .btns{
    position:absolute;right:clamp(18px,4.2vw,54px);bottom:clamp(18px,4vw,38px);
    display:flex;gap:10px;pointer-events:auto;flex-wrap:wrap;justify-content:flex-end;
  }
  .btns button{
    appearance:none;border:1px solid rgba(224,192,122,.32);
    background:rgba(10,17,24,.55);color:#efdfb8;
    padding:11px 18px;border-radius:999px;font-size:12px;letter-spacing:.14em;
    font-family:inherit;cursor:pointer;backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    transition:background .25s,border-color .25s,transform .25s,color .25s;
    white-space:nowrap;
  }
  .btns button:hover{background:rgba(170,132,58,.24);border-color:rgba(240,212,150,.7);transform:translateY(-1px)}
  .btns button.on{background:rgba(190,148,68,.30);border-color:rgba(246,220,162,.85);color:#fff3d2}

  .vignette{
    position:fixed;inset:0;z-index:7;pointer-events:none;
    background:radial-gradient(ellipse at 50% 44%,rgba(0,0,0,0) 40%,rgba(2,8,13,.46) 100%);
  }
  #leaders{position:fixed;inset:0;z-index:8;width:100%;height:100%;pointer-events:none;overflow:visible}
  #labels{position:fixed;inset:0;z-index:9;pointer-events:none;overflow:hidden}
  .bLabel{
    position:absolute;left:0;top:0;white-space:nowrap;will-change:transform,opacity;
    padding:5px 10px 6px;border:1px solid rgba(232,201,125,.55);border-radius:3px;
    background:rgba(8,15,21,.82);color:#f4e2b4;
    font-family:"Songti SC","STSong","SimSun","Noto Serif SC",serif;
    font-size:12px;letter-spacing:.16em;text-indent:.16em;line-height:1;
    box-shadow:0 5px 20px rgba(0,0,0,.35);
    backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);
    transition:opacity .2s ease;
  }
  .bLabel.main{
    font-size:14px;padding:6px 13px 7px;letter-spacing:.2em;
    border-color:rgba(244,214,150,.7);color:#ffedc3;
  }

  #loading{
    position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:18px;
    background:radial-gradient(circle at 50% 38%,#172633 0%,#0b1219 52%,#05090d 100%);
    transition:opacity .9s ease,visibility .9s;
  }
  #loading.hide{opacity:0;visibility:hidden;pointer-events:none}
  #loading .mark{
    width:58px;height:58px;border:1px solid rgba(232,201,125,.45);
    display:flex;align-items:center;justify-content:center;
    color:#e8c97d;font-family:"KaiTi","STKaiti","SimSun",serif;font-size:32px;
    position:relative;
  }
  #loading .mark::after{
    content:"";position:absolute;inset:4px;border:1px solid rgba(232,201,125,.15);
  }
  #loading .spinner{
    width:34px;height:34px;border-radius:50%;
    border:1px solid rgba(232,201,125,.18);border-top-color:#e8c97d;
    animation:spin 1.05s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  #loading .load-title{
    font-family:"Songti SC","STSong","SimSun",serif;
    font-size:20px;letter-spacing:.34em;color:#f0dda9;
  }
  #loading .load-sub{font-size:11px;letter-spacing:.18em;color:rgba(235,224,196,.5)}

  @media (max-width:640px){
    .bLabel{font-size:10px;padding:4px 7px 5px;letter-spacing:.1em;text-indent:.1em}
    .bLabel.main{font-size:11px;padding:5px 9px 6px}
    .brand{padding-right:52px}
    .brand .seal{width:34px;height:38px;font-size:13px;right:0}
    .brand .meta{display:none}
    .hint{bottom:88px;font-size:10px;letter-spacing:.12em}
    .btns{left:16px;right:16px;bottom:18px;justify-content:center}
    .btns button{padding:10px 14px;font-size:11px}
  }
</style>
</head>
<body>
<div id="app"></div>
<div class="vignette"></div>
<svg id="leaders" xmlns="http://www.w3.org/2000/svg"></svg>
<div id="labels"></div>

<div class="ui">
  <div class="brand">
    <div class="seal">故宫</div>
    <h1>紫禁城</h1>
    <div class="en">THE FORBIDDEN CITY · BEIJING</div>
    <div class="rule"></div>
    <div class="meta">明永乐十八年始建 · 世界文化遗产</div>
  </div>

  <div class="hint">拖动旋转　·　滚轮缩放　·　右键平移</div>

  <div class="btns">
    <button id="btnRotate" type="button">自动巡游</button>
    <button id="btnWeather" type="button">天气：晴</button>
    <button id="btnLabels" type="button">隐藏标注</button>
    <button id="btnReset" type="button">重置视角</button>
    <button id="btnNight" type="button">夜景</button>
  </div>
</div>

<div id="loading">
  <div class="mark">宮</div>
  <div class="spinner"></div>
  <div class="load-title">正在营建紫禁城</div>
  <div class="load-sub" id="loadSub">加载三维场景与琉璃瓦…</div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============================================================
   基础
   ============================================================ */
const TAU = Math.PI * 2;
const BASE = 0.35;
const WALL_H = 10.5;
const WALL_TOP = BASE + WALL_H;
const TERRACE_Y = BASE + 9;

const app = document.getElementById('app');
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xcfdde5, 820, 4200);

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.5, 12000);

let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
} catch (err) {
  document.getElementById('loadSub').textContent = '当前浏览器不支持 WebGL';
  throw err;
}
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.25));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
app.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 16, 14);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.minDistance = 35;
controls.maxDistance = 1800;
controls.minPolarAngle = 0.08;
controls.maxPolarAngle = Math.PI * 0.495;
controls.autoRotateSpeed = 0.45;

const root = new THREE.Group();
scene.add(root);

/* 批量实例化用的收集器 */
const columnInstances = [];
const doorInstances = [];
const compoundWallInstances = [];
const compoundCapInstances = [];
const _instP = new THREE.Vector3();
const _instS = new THREE.Vector3();
const _instQ = new THREE.Quaternion();
const _instM = new THREE.Matrix4();
const Y_AXIS = new THREE.Vector3(0, 1, 0);

/* ============================================================
   种子随机 / 程序化贴图
   ============================================================ */
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const rand = mulberry32(20261106);
const maxAniso = renderer.capabilities.getMaxAnisotropy();

function makeTexture(w, h, draw, repeatX = 1, repeatY = 1) {
  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d');
  draw(ctx, w, h);
  const tex = new THREE.CanvasTexture(canvas);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(repeatX, repeatY);
  tex.anisotropy = maxAniso;
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

/* 石板地面 */
const stoneTex = makeTexture(512, 512, (ctx, w, h) => {
  const r = mulberry32(11);
  ctx.fillStyle = '#b7b0a1';
  ctx.fillRect(0, 0, w, h);
  for (let i = 0; i < 3600; i++) {
    const v = 135 + Math.floor(r() * 70);
    ctx.fillStyle = `rgba(${v},${v - 5},${v - 18},${0.05 + r() * 0.08})`;
    ctx.beginPath();
    ctx.arc(r() * w, r() * h, 0.6 + r() * 3.2, 0, TAU);
    ctx.fill();
  }
  const rows = 8, cols = 4;
  for (let row = 0; row < rows; row++) {
    const y0 = row * h / rows;
    const off = (row % 2) ? w / cols / 2 : 0;
    for (let col = -1; col <= cols; col++) {
      const x0 = col * w / cols + off;
      if (r() < 0.55) {
        const v = 0.02 + r() * 0.05;
        ctx.fillStyle = `rgba(80,74,62,${v})`;
        ctx.fillRect(x0 + 3, y0 + 3, w / cols - 6, h / rows - 6);
      }
    }
  }
  ctx.strokeStyle = 'rgba(88,84,74,.42)';
  ctx.lineWidth = 2.4;
  for (let row = 0; row <= rows; row++) {
    ctx.beginPath(); ctx.moveTo(0, row * h / rows); ctx.lineTo(w, row * h / rows); ctx.stroke();
  }
  for (let row = 0; row < rows; row++) {
    const off = (row % 2) ? w / cols / 2 : 0;
    for (let col = -1; col <= cols; col++) {
      const x = col * w / cols + off;
      ctx.beginPath(); ctx.moveTo(x, row * h / rows); ctx.lineTo(x, (row + 1) * h / rows); ctx.stroke();
    }
  }
}, 26, 34);

/* 汉白玉 */
const marbleTex = makeTexture(256, 256, (ctx, w, h) => {
  const r = mulberry32(5);
  ctx.fillStyle = '#e7e0d1';
  ctx.fillRect(0, 0, w, h);
  for (let i = 0; i < 900; i++) {
    ctx.fillStyle = `rgba(160,152,135,${0.02 + r() * 0.05})`;
    ctx.beginPath(); ctx.arc(r() * w, r() * h, 1 + r() * 5, 0, TAU); ctx.fill();
  }
  ctx.strokeStyle = 'rgba(150,142,126,.18)';
  for (let i = 0; i < 14; i++) {
    ctx.lineWidth = 0.5 + r() * 1.2;
    ctx.beginPath();
    const y = r() * h;
    ctx.moveTo(0, y);
    ctx.bezierCurveTo(w * 0.3, y + (r() - 0.5) * 40, w * 0.7, y + (r() - 0.5) * 40, w, y + (r() - 0.5) * 20);
    ctx.stroke();
  }
  ctx.strokeStyle = 'rgba(120,112,98,.14)';
  ctx.lineWidth = 1.6;
  for (let i = 0; i <= 4; i++) {
    ctx.beginPath(); ctx.moveTo(0, i * h / 4); ctx.lineTo(w, i * h / 4); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(i * w / 4, 0); ctx.lineTo(i * w / 4, h); ctx.stroke();
  }
}, 3, 3);

/* 红墙 */
const wallTex = makeTexture(128, 128, (ctx, w, h) => {
  const r = mulberry32(7);
  ctx.fillStyle = '#a33126';
  ctx.fillRect(0, 0, w, h);
  for (let i = 0; i < 1600; i++) {
    const light = r() > 0.5;
    ctx.fillStyle = light ? `rgba(255,180,150,${r() * 0.045})` : `rgba(70,15,10,${r() * 0.06})`;
    ctx.beginPath(); ctx.arc(r() * w, r() * h, 0.5 + r() * 2.2, 0, TAU); ctx.fill();
  }
}, 2, 2);

/* 琉璃瓦 */
const roofTex = makeTexture(256, 256, (ctx, w, h) => {
  const g = ctx.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, '#e0ae3c');
  g.addColorStop(0.55, '#d3a02e');
  g.addColorStop(1, '#c69425');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, w, h);
  for (let x = 0; x < w; x += 16) {
    ctx.fillStyle = 'rgba(255,222,137,.42)';
    ctx.fillRect(x, 0, 2, h);
    ctx.fillStyle = 'rgba(118,78,10,.42)';
    ctx.fillRect(x + 8, 0, 3, h);
    ctx.fillStyle = 'rgba(255,235,170,.16)';
    ctx.fillRect(x + 11, 0, 1, h);
  }
  for (let y = 8; y < h; y += 32) {
    ctx.fillStyle = 'rgba(122,84,12,.30)';
    ctx.fillRect(0, y, w, 2);
    ctx.fillStyle = 'rgba(255,226,145,.22)';
    ctx.fillRect(0, y + 2, w, 2);
  }
});

/* 绿琉璃瓦（文渊阁一类） */
const greenRoofTex = makeTexture(256, 256, (ctx, w, h) => {
  const g = ctx.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, '#4d7a59');
  g.addColorStop(0.55, '#3e694c');
  g.addColorStop(1, '#32593f');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, w, h);
  for (let x = 0; x < w; x += 16) {
    ctx.fillStyle = 'rgba(180,220,175,.35)';
    ctx.fillRect(x, 0, 2, h);
    ctx.fillStyle = 'rgba(18,50,32,.45)';
    ctx.fillRect(x + 8, 0, 3, h);
  }
  for (let y = 8; y < h; y += 32) {
    ctx.fillStyle = 'rgba(15,40,26,.35)';
    ctx.fillRect(0, y, w, 2);
    ctx.fillStyle = 'rgba(190,225,185,.16)';
    ctx.fillRect(0, y + 2, w, 2);
  }
});

/* 门扇 */
const doorTex = makeTexture(256, 512, (ctx, w, h) => {
  ctx.fillStyle = '#5c170f';
  ctx.fillRect(0, 0, w, h);
  ctx.fillStyle = '#4a100b';
  ctx.fillRect(10, 10, w - 20, h - 20);
  ctx.strokeStyle = '#c9a24a';
  ctx.lineWidth = 5;
  ctx.strokeRect(10, 10, w - 20, h - 20);
  const top = h * 0.44;
  ctx.fillStyle = '#3a0d09';
  ctx.fillRect(16, 16, w - 32, top - 16);
  ctx.strokeStyle = 'rgba(216,174,90,.82)';
  ctx.lineWidth = 2.4;
  for (let x = 22; x < w - 18; x += 17) {
    ctx.beginPath(); ctx.moveTo(x, 18); ctx.lineTo(x, top); ctx.stroke();
  }
  for (let y = 26; y < top; y += 17) {
    ctx.beginPath(); ctx.moveTo(18, y); ctx.lineTo(w - 18, y); ctx.stroke();
  }
  ctx.fillStyle = '#8e2a1c';
  ctx.fillRect(14, top + 8, w - 28, 18);
  ctx.strokeStyle = '#c9a24a';
  ctx.lineWidth = 2;
  ctx.strokeRect(14, top + 8, w - 28, 18);
  const cols = 5, rows = 4;
  for (let row = 0; row < rows; row++) {
    for (let col = 0; col < cols; col++) {
      const cx = 30 + col * (w - 60) / (cols - 1);
      const cy = top + 50 + row * (h - top - 90) / (rows - 1);
      const grad = ctx.createRadialGradient(cx - 2, cy - 2, 1, cx, cy, 8);
      grad.addColorStop(0, '#ffe7a4');
      grad.addColorStop(0.55, '#c69a3e');
      grad.addColorStop(1, '#6e4d14');
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(cx, cy, 7, 0, TAU); ctx.fill();
    }
  }
});

/* 斗拱彩画 */
const bracketTex = makeTexture(256, 64, (ctx, w, h) => {
  ctx.fillStyle = '#1c4a43';
  ctx.fillRect(0, 0, w, h);
  ctx.fillStyle = '#2a6158';
  ctx.fillRect(0, 7, w, h - 14);
  for (let x = 0; x < w; x += 32) {
    ctx.fillStyle = '#356f62';
    ctx.fillRect(x + 4, 12, 24, h - 24);
    ctx.strokeStyle = '#c8a24b';
    ctx.lineWidth = 2;
    ctx.strokeRect(x + 4, 12, 24, h - 24);
    ctx.fillStyle = '#c8a24b';
    ctx.beginPath(); ctx.arc(x + 16, h / 2, 3.5, 0, TAU); ctx.fill();
  }
  ctx.fillStyle = '#c8a24b';
  ctx.fillRect(0, 0, w, 3);
  ctx.fillRect(0, h - 3, w, 3);
}, 7, 1);

/* 水面 */
const waterTex = makeTexture(256, 256, (ctx, w, h) => {
  const r = mulberry32(19);
  ctx.fillStyle = '#3f6f7a';
  ctx.fillRect(0, 0, w, h);
  for (let i = 0; i < 800; i++) {
    ctx.fillStyle = `rgba(190,225,225,${r() * 0.035})`;
    ctx.beginPath();
    ctx.arc(r() * w, r() * h, 0.6 + r() * 2.6, 0, TAU);
    ctx.fill();
  }
  for (let i = 0; i < 26; i++) {
    const baseY = r() * h;
    ctx.strokeStyle = `rgba(205,235,235,${0.02 + r() * 0.05})`;
    ctx.lineWidth = 0.8 + r() * 1.3;
    ctx.beginPath();
    for (let x = 0; x <= w; x += 8) {
      const y = baseY + Math.sin((x / w) * Math.PI * 4 + i * 0.7) * (2 + r() * 3);
      if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
  }
}, 1, 1);

const pathTex = stoneTex.clone();
pathTex.repeat.set(2.2, 28);
pathTex.needsUpdate = true;

/* 窗棂 */
const windowTex = makeTexture(256, 160, (ctx, w, h) => {
  ctx.fillStyle = '#183e38';
  ctx.fillRect(0, 0, w, h);
  ctx.fillStyle = '#5a3919';
  ctx.fillRect(9, 9, w - 18, h - 18);
  const g = ctx.createLinearGradient(0, 9, 0, h - 9);
  g.addColorStop(0, '#7d5727');
  g.addColorStop(0.55, '#63441d');
  g.addColorStop(1, '#432a11');
  ctx.fillStyle = g;
  ctx.fillRect(13, 13, w - 26, h - 26);
  ctx.strokeStyle = '#d8b05a';
  ctx.lineWidth = 3;
  ctx.strokeRect(13, 13, w - 26, h - 26);
  ctx.lineWidth = 2;
  for (let i = 1; i < 4; i++) {
    const x = 13 + (w - 26) * i / 4;
    ctx.beginPath(); ctx.moveTo(x, 13); ctx.lineTo(x, h - 13); ctx.stroke();
  }
  for (let i = 1; i < 3; i++) {
    const y = 13 + (h - 26) * i / 3;
    ctx.beginPath(); ctx.moveTo(13, y); ctx.lineTo(w - 13, y); ctx.stroke();
  }
  ctx.strokeStyle = 'rgba(49,105,94,.9)';
  ctx.lineWidth = 2;
  for (let i = 1; i < 4; i++) {
    const x = 13 + (w - 26) * i / 4 + 4;
    ctx.beginPath(); ctx.moveTo(x, 17); ctx.lineTo(x, h - 17); ctx.stroke();
  }
  ctx.fillStyle = '#d8b05a';
  ctx.beginPath();
  ctx.moveTo(w / 2, h / 2 - 17);
  ctx.lineTo(w / 2 + 17, h / 2);
  ctx.lineTo(w / 2, h / 2 + 17);
  ctx.lineTo(w / 2 - 17, h / 2);
  ctx.closePath();
  ctx.fill();
});

/* 积雪地面 */
const snowTex = makeTexture(512, 512, (ctx, w, h) => {
  const r = mulberry32(31);
  ctx.fillStyle = '#e8eff4';
  ctx.fillRect(0, 0, w, h);
  for (let i = 0; i < 2200; i++) {
    const v = 210 + Math.floor(r() * 40);

  s.absarc(0, h - r, r, Math.PI, 0, true);

  const geo = new THREE.ShapeGeometry(s, 28);

}

/* ============================================================
   屋顶
   ============================================================ */
function buildRoofGeometry(w, d, h, lift, segX = 20, segY = 11) {
  const hw = w / 2, hd = d / 2;
  const rx = Math.max(0.001, hw - hd * 0.92);
  const positions = [], uvs = [], indices = [];
  const slopeLen = Math.hypot(hd, h);
  const cols = segX + 1;

  function surface(type, order) {
    const start = positions.length / 3;
    for (let j = 0; j <= segY; j++) {
      const t = j / segY;
      for (let i = 0; i <= segX; i++) {
        const s = i / segX;
        let x, z, eaveY, u;
        if (type === 'front' || type === 'back') {
          const sign = type === 'front' ? -1 : 1;
          const xE = -hw + w * s;
          const zE = sign * hd;
          const cf = Math.pow(Math.abs(2 * s - 1), 4);
          eaveY = lift * cf;
          x = THREE.MathUtils.lerp(xE, THREE.MathUtils.clamp(xE, -rx, rx), t);
          z = THREE.MathUtils.lerp(zE, 0, t);
          u = x / 6;
        } else {
          const sign = type === 'right' ? 1 : -1;
          const zE = -hd + d * s;
          const xE = sign * hw;
          const cf = Math.pow(Math.abs(2 * s - 1), 4);
          eaveY = lift * cf;
          x = THREE.MathUtils.lerp(xE, sign * rx, t);
          z = THREE.MathUtils.lerp(zE, 0, t);
          u = z / 6;
        }
        const y = h * Math.pow(t, 1.55) + eaveY * Math.pow(1 - t, 2);
        positions.push(x, y, z);
        uvs.push(u, t * slopeLen / 6);
      }
    }
    for (let j = 0; j < segY; j++) {
      for (let i = 0; i < segX; i++) {
        const a = start + j * cols + i;
        const b = a + 1;
        const c = a + cols;
        const dd = c + 1;
        if (order === 'acb') {
          indices.push(a, c, b, b, c, dd);
        } else {
          indices.push(a, b, c, b, dd, c);
        }
      }
    }
  }

  surface('front', 'acb');
  surface('back', 'abc');
  surface('left', 'abc');
  surface('right', 'acb');

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  geo.setIndex(indices);
  geo.computeVertexNormals();
  geo.computeBoundingSphere();
  return { geo, rx, hw, hd };
}

function eavePoints(hw, hd, lift, steps) {
  const corners = [[-hw, -hd], [hw, -hd], [hw, hd], [-hw, hd]];
  const pts = [];
  for (let e = 0; e < 4; e++) {
    const [x1, z1] = corners[e];
    const [x2, z2] = corners[(e + 1) % 4];
    for (let i = 0; i < steps; i++) {
      const s = i / steps;
      const f = Math.pow(Math.abs(2 * s - 1), 4);
      pts.push(new THREE.Vector3(
        x1 + (x2 - x1) * s,
        lift * f,
        z1 + (z2 - z1) * s
      ));
    }
  }
  return pts;
}

const snowRoofMeshes = [];

function createRoof(w, d, h, opts = {}) {
  const lift = opts.lift ?? Math.min(4.0, Math.max(1.0, Math.min(w, d) * 0.055));
  const roofMat = opts.mat || MAT.roof;
  const { geo, rx, hw, hd } = buildRoofGeometry(w, d, h, lift);
  const g = new THREE.Group();

  const mesh = new THREE.Mesh(geo, roofMat);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  g.add(mesh);

  const snow = new THREE.Mesh(geo, MAT.snowRoof);
  snow.visible = false;
  snow.receiveShadow = false;
  snow.renderOrder = 2;
  g.add(snow);
  snowRoofMeshes.push(snow);

  if (opts.simple) {
    if (rx > 0.6) {
      const ridge = new THREE.Mesh(new THREE.BoxGeometry(Math.max(0.4, 2 * rx * 0.95), 0.5, 0.7), MAT.ridge);
      ridge.position.y = h + 0.2;
      ridge.castShadow = true;
      g.add(ridge);
    }
    return g;
  }

  const eaveCurve = new THREE.CatmullRomCurve3(eavePoints(hw, hd, lift, 7), true, 'catmullrom', 0.25);
  const eave = new THREE.Mesh(
    new THREE.TubeGeometry(eaveCurve, 100, Math.max(0.22, Math.min(0.38, w * 0.006)), 4, true),
    MAT.ridge
  );
  eave.castShadow = true;
  g.add(eave);

  if (rx > 0.55) {
    for (const sx of [-1, 1]) {
      for (const sz of [-1, 1]) {
        const pts = [];
        for (let i = 0; i <= 12; i++) {
          const t = i / 12;
          pts.push(new THREE.Vector3(
            sx * (hw + (rx - hw) * t),
            h * Math.pow(t, 1.55) + lift * Math.pow(1 - t, 2),
            sz * hd * (1 - t)
          ));
        }
        const curve = new THREE.CatmullRomCurve3(pts);
        const tube = new THREE.Mesh(
          new THREE.TubeGeometry(curve, 22, 0.27, 4, false),
          MAT.ridge
        );
        tube.castShadow = true;
        g.add(tube);
      }
    }
    if (rx > 1.1) {
      const ridge = new THREE.Mesh(new THREE.BoxGeometry(2 * rx, 0.72, 0.85), MAT.ridge);
      ridge.position.y = h + 0.25;
      ridge.castShadow = true;
      g.add(ridge);
      for (const sx of [-1, 1]) {
        const orn = new THREE.Mesh(new THREE.BoxGeometry(0.9, 1.7, 0.62), MAT.ridge);
        orn.position.set(sx * (rx + 0.05), h + 0.95, 0);
        orn.rotation.z = sx * 0.28;
        orn.castShadow = true;
        g.add(orn);
      }
    }
  } else {
    const ball = new THREE.Mesh(new THREE.SphereGeometry(0.82, 12, 10), MAT.gold);
    ball.position.y = h + 0.72;
    ball.castShadow = true;
    g.add(ball);
    const spike = new THREE.Mesh(new THREE.ConeGeometry(0.33, 1.4, 8), MAT.gold);
    spike.position.y = h + 1.9;
    spike.castShadow = true;
    g.add(spike);
  }

  return g;
}

const plaqueCache = {};
const plaqueMats = [];
function getPlaqueMaterial(text) {
  if (plaqueCache[text]) return plaqueCache[text];
  const tex = makeTexture(512, 168, (ctx, w, h) => {
    ctx.fillStyle = '#122947';
    ctx.fillRect(5, 5, w - 10, h - 10);
    ctx.strokeStyle = '#d9b764';
    ctx.lineWidth = 7;
    ctx.strokeRect(12, 12, w - 24, h - 24);
    ctx.strokeStyle = 'rgba(217,183,100,.45)';
    ctx.lineWidth = 2;
    ctx.strokeRect(24, 24, w - 48, h - 48);
    ctx.fillStyle = '#d9b764';
    for (const p of [[30, 30], [w - 30, 30], [30, h - 30], [w - 30, h - 30]]) {
      ctx.beginPath(); ctx.arc(p[0], p[1], 4, 0, TAU); ctx.fill();
    }
    const chars = [...text];
    const fontSize = 96;
    ctx.font = `bold ${fontSize}px "KaiTi","STKaiti","SimSun","Songti SC",serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#f7dfa0';
    ctx.shadowColor = 'rgba(0,0,0,.55)';
    ctx.shadowBlur = 8;
    ctx.shadowOffsetY = 3;
    const step = fontSize * 1.28;
    let cx = w / 2 - (chars.length - 1) * step / 2;
    for (const ch of chars) {
      ctx.fillText(ch, cx, h / 2 + 4);
      cx += step;
    }
  });
  tex.wrapS = tex.wrapT = THREE.ClampToEdgeWrapping;
  const mat = new THREE.MeshStandardMaterial({
    map: tex, roughness: 0.52, metalness: 0.08,
    emissive: 0xffc96a, emissiveMap: tex, emissiveIntensity: 0
  });
  plaqueCache[text] = mat;
  plaqueMats.push(mat);
  return mat;
}

function addWindowStrip(parent, width, height, x, y, z, rotY, repeats) {
  const geo = new THREE.PlaneGeometry(width, height);

  for (let i = 0; i < uv.count; i++) {
    uv.setX(i, uv.getX(i) * repeats);

  uv.needsUpdate = true;
  const m = new THREE.Mesh(geo, MAT.window);
  m.position.set(x, y, z);
  m.rotation.y = rotY;
  m.castShadow = false;
  m.receiveShadow = true;
  parent.add(m);
  return m;
}

function createHall(cfg) {
  const {
    x = 0, z = 0, w = 20, d = 12, h = 9, roofH = 6,
    double = false, rotY = 0, baseY = BASE, plaque = null,
    bays = null, roofLift = null
  } = cfg;

  const g = new THREE.Group();
  g.position.set(x, baseY, z);
  g.rotation.y = rotY;
  g.updateMatrixWorld(true);

  addBox(w + 1.8, 1.2, d + 1.8, MAT.marble, 0, 0.6, 0, g);
  addBox(w, h, d, MAT.wall, 0, h / 2, 0, g);

  const bayCount = bays ?? Math.max(3, (Math.round(w / 5.2) | 1));
  const innerW = Math.max(2, w - 3.2);
  const colH = h - 1.6;

  for (let i = 0; i < bayCount; i++) {
    const px = -innerW / 2 + i * innerW / (bayCount - 1);
    _instP.set(px, colH / 2 + 0.4, d / 2 + 0.85).applyMatrix4(g.matrixWorld);
    columnInstances.push({ x: _instP.x, y: _instP.y, z: _instP.z, h: colH });
  }
  if (w > 17) {
    for (const sx of [-1, 1]) {
      for (let i = 0; i < 3; i++) {
        _instP.set(sx * (w / 2 + 0.35), colH / 2 + 0.4, -d / 2 + d * (i + 0.5) / 3).applyMatrix4(g.matrixWorld);
        columnInstances.push({ x: _instP.x, y: _instP.y, z: _instP.z, h: colH });
      }
    }
  }

  const panelH = Math.min(h * 0.6, h - 4.2);
  if (panelH > 1.3) {
    const seg = innerW / (bayCount - 1);
    for (let i = 0; i < bayCount - 1; i++) {
      _instP.set(-innerW / 2 + (i + 0.5) * seg, 1.2 + panelH / 2, d / 2 + 0.12).applyMatrix4(g.matrixWorld);
      doorInstances.push({ x: _instP.x, y: _instP.y, z: _instP.z, w: seg * 0.78, h: panelH, rotY });
    }
  }

  /* 上层窗棂：正面、背面与两侧 */
  const winH = Math.max(0.8, Math.min(1.9, h * 0.13));
  const winY = h * 0.8;
  const winRep = Math.max(2, bayCount);
  addWindowStrip(g, w * 0.9, winH, 0, winY, d / 2 + 0.16, 0, winRep);
  addWindowStrip(g, w * 0.9, winH, 0, winY, -d / 2 - 0.16, Math.PI, winRep);
  const sideRep = Math.max(2, Math.round(d / 5));
  addWindowStrip(g, d * 0.82, winH, w / 2 + 0.16, winY, 0, Math.PI / 2, sideRep);
  addWindowStrip(g, d * 0.82, winH, -w / 2 - 0.16, winY, 0, -Math.PI / 2, sideRep);

  addBox(w + 2.6, 1.3, d + 2.6, MAT.bracket, 0, h - 0.75, 0, g);
  addBox(w + 2.9, 0.2, d + 2.9, MAT.gold, 0, h - 1.46, 0, g);

  if (plaque) {
    const mat = getPlaqueMaterial(plaque);
    const pw = Math.min(9, w * 0.34);
    const ph = pw / 3.05;
    const p = new THREE.Mesh(new THREE.PlaneGeometry(pw, ph), mat);
    p.position.set(0, Math.min(h - 2.5, h * 0.76), d / 2 + 1.42);
    p.castShadow = false;
    g.add(p);
  }

  if (double) {
    const lower = createRoof(w + 11, d + 9, Math.min(6.6, h * 0.42), { lift: roofLift ?? undefined });
    lower.position.y = h * 0.56;
    g.add(lower);
    const upper = createRoof(w + 7.5, d + 6.5, roofH, { lift: roofLift ?? undefined });
    upper.position.y = h;
    g.add(upper);
  } else {
    const roof = createRoof(w + 7.5, d + 6.5, roofH, { lift: roofLift ?? undefined });
    roof.position.y = h;
    g.add(roof);
  }

  root.add(g);
  return g;
}

function addCourtyardWalls(cx, cz, w, d) {
  const g = new THREE.Group();
  g.position.set(cx, BASE, cz);
  const h = 5.0, t = 1.3, gap = 9;
  const hw = w / 2, hd = d / 2;

  function piece(len, x, z, rotY) {
    const m = addBox(len, h, t, MAT.wall, x, h / 2, z, g);
    m.rotation.y = rotY;
    const cap = new THREE.Mesh(gableCapGeometry(len + 0.8, t + 1.5, 0.85), MAT.roofPlain);
    cap.position.set(x, h, z);
    cap.rotation.y = rotY;
    cap.castShadow = true;
    cap.receiveShadow = true;
    g.add(cap);
  }

  piece((w - gap) / 2, -(w + gap) / 4, hd, 0);
  piece((w - gap) / 2, (w + gap) / 4, hd, 0);
  piece(w, 0, -hd, 0);
  piece(d, -hw, 0, Math.PI / 2);
  piece(d, hw, 0, Math.PI / 2);

  root.add(g);
}

function createSimpleHall(cfg) {

  addBox(w, h, d, MAT.wall, 0, h / 2, 0, g);

  if (panelH > 1.2) {
    _instP.set(0, 1.0 + panelH / 2, d / 2 + 0.06).applyMatrix4(g.matrixWorld);
    doorInstances.push({ x: _instP.x, y: _instP.y, z: _instP.z, w: w * 0.62, h: panelH, rotY });
  }
  addWindowStrip(g, w * 0.82, Math.max(0.7, Math.min(1.3, h * 0.12)), 0, h * 0.8, d / 2 + 0.09, 0, 3);

  addBox(w + 1.6, 0.7, d + 1.6, MAT.bracket, 0, h - 0.35, 0, g);

}

function addCompound(cfg) {

    compoundCapInstances.push({ x: cx, y: BASE + wallH + 0.15, z: cz, w: len + 0.5, h: 0.3, d: t + 1.2, rotY });
  }

  const hw = w / 2, hd = d / 2;
  wall((w - gap) / 2, -(hw + gap / 2) / 2, z + hd);
  wall((w - gap) / 2, (hw + gap / 2) / 2, z + hd);

  wall(d, x + hw, z, Math.PI / 2);

  createSimpleHall({
    x, z: z - d * 0.16, w: hallW, d: hallD, h: hallH,

  if (tree) {

}

function buildInstancedDetails() {
  function make(instances, geo, mat, castShadow, receiveShadow) {
    if (!instances.length) return;
    const mesh = new THREE.InstancedMesh(geo, mat, instances.length);
    for (let i = 0; i < instances.length; i++) {
      const it = instances[i];
      _instP.set(it.x, it.y, it.z);
      _instQ.setFromAxisAngle(Y_AXIS, it.rotY || 0);
      _instS.set(it.w ?? 1, it.h ?? 1, it.d ?? 1);
      _instM.compose(_instP, _instQ, _instS);
      mesh.setMatrixAt(i, _instM);
    }
    mesh.instanceMatrix.needsUpdate = true;
    mesh.castShadow = castShadow;
    mesh.receiveShadow = receiveShadow;
    mesh.frustumCulled = false;
    root.add(mesh);
  }

  make(columnInstances, new THREE.CylinderGeometry(0.55, 0.62, 1, 10), MAT.column, true, true);
  make(doorInstances, new THREE.PlaneGeometry(1, 1), MAT.door, false, false);
  make(compoundWallInstances, new THREE.BoxGeometry(1, 1, 1), MAT.wall, true, true);
  make(compoundCapInstances, new THREE.BoxGeometry(1, 1, 1), MAT.roofPlain, true, true);
}

/* ============================================================
   须弥座三台 / 栏杆 / 台阶
   ============================================================ */
function addBalustrade(w, d, cx, cz, y, gap = 0) {
  const g = new THREE.Group();
  g.position.set(cx, y, cz);
  const hw = w / 2, hd = d / 2;
  const postPts = [];
  const seen = new Set();

  function addPost(x, z) {
    const key = x.toFixed(2) + '|' + z.toFixed(2);
    if (!seen.has(key)) {
      seen.add(key);
      postPts.push([x, z]);
    }
  }

  function rail(x1, z1, x2, z2) {
    const dx = x2 - x1, dz = z2 - z1;
    const len = Math.hypot(dx, dz);
    if (len < 0.25) return;
    const m = addBox(len, 0.72, 0.28, MAT.marble, (x1 + x2) / 2, 0.52, (z1 + z2) / 2, g);
    m.rotation.y = -Math.atan2(dz, dx);
    const n = Math.max(1, Math.round(len / 3.2));
    for (let i = 0; i <= n; i++) {
      const t = i / n;
      addPost(x1 + dx * t, z1 + dz * t);
    }
  }

  if (gap > 0) {
    rail(-hw, hd, -gap / 2, hd);
    rail(gap / 2, hd, hw, hd);
    rail(-hw, -hd, -gap / 2, -hd);
    rail(gap / 2, -hd, hw, -hd);
  } else {
    rail(-hw, hd, hw, hd);
    rail(-hw, -hd, hw, -hd);
  }
  rail(-hw, -hd, -hw, hd);
  rail(hw, -hd, hw, hd);

  const inst = new THREE.InstancedMesh(
    new THREE.BoxGeometry(0.5, 1.15, 0.5), MAT.marble, postPts.length
  );
  const m4 = new THREE.Matrix4();
  postPts.forEach((p, i) => {
    m4.makeTranslation(p[0], 0.575, p[1]);
    inst.setMatrixAt(i, m4);
  });
  inst.instanceMatrix.needsUpdate = true;
  inst.castShadow = true;
  inst.receiveShadow = true;
  g.add(inst);

  root.add(g);
}

function addStairs(x, zTop, dir, width, floorY) {
  const groundY = BASE;
  const n = 18;
  const stepH = (floorY - groundY) / n;
  const stepD = 0.55;
  for (let i = 0; i < n - 1; i++) {
    const top = floorY - (i + 1) * stepH;
    if (top <= groundY + 0.02) continue;
    const hh = top - groundY;
    addBox(width, hh, stepD, MAT.marble, x, groundY + hh / 2, zTop + dir * (i + 0.5) * stepD, root);
  }
}

const trees = [];

function addTree(x, z, s = 1) {
  const g = new THREE.Group();
  g.position.set(x, BASE, z);
  g.userData.phase = rand() * TAU;

  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.32 * s, 0.5 * s, 4 * s, 6), MAT.trunk);
  trunk.position.y = 2 * s;
  trunk.castShadow = true;
  trunk.receiveShadow = true;
  g.add(trunk);

  const leafMats = [MAT.leaf1, MAT.leaf2, MAT.leaf3, MAT.leaf4];
  for (let i = 0; i < 4; i++) {
    const r = (2.5 - i * 0.46) * s;
    const hh = (4.8 - i * 0.72) * s;
    const cone = new THREE.Mesh(new THREE.ConeGeometry(r, hh, 7), leafMats[i % 4]);
    cone.position.y = (4.1 + i * 1.75) * s;
    cone.castShadow = true;
    cone.receiveShadow = true;
    g.add(cone);
  }

  root.add(g);
  trees.push(g);
}

function addBroadleaf(x, z, s = 1) {
  const g = new THREE.Group();

  trunk.position.y = 2.6 * s;
  trunk.castShadow = true;

    [1.8, 4.9, -0.8, 2.0, MAT.leaf1],
    [0.6, 6.8, -0.5, 1.8, MAT.leaf2]

  for (const [bx, by, bz, br, bm] of blobs) {

    blob.scale.setScalar(br * s);
    blob.castShadow = true;
    blob.receiveShadow = true;
    g.add(blob);

  root.add(g);
  trees.push(g);
}

{

function buildPath(points) {
  const pts = points.map(p => new THREE.Vector2(p[0], p[1]));
  const segs = [];
  let total = 0;
  for (let i = 0; i < pts.length; i++) {
    const a = pts[i];
    const b = pts[(i + 1) % pts.length];
    const len = a.distanceTo(b);
    segs.push({ a, b, len, start: total });
    total += len;
  }
  return { pts, segs, total };
}

    );
    const person = {

      speed: 2.3 + rand() * 1.3,
      phase: rand() * TAU,

    };

  }
}

  p.group.rotation.y = ry;
  p.blob.position.x = x;
  p.blob.position.z = z;
  people.push({ ...p, idle: true, phase: rand() * TAU, baseX: x, baseZ: z, baseRy: ry });

function updatePeople(dt, time) {
  for (const p of people) {
    if (p.idle) {
      p.group.position.y = BASE + Math.sin(time * 1.2 + p.phase) * 0.015;
      p.armL.rotation.x = Math.sin(time * 0.8 + p.phase) * 0.04;
      p.armR.rotation.x = -Math.sin(time * 0.8 + p.phase) * 0.04;
      if (p.umbrella) p.umbrella.visible = weather.rain > 0.5;
      continue;
    }

    p.dist = (p.dist + p.speed * dt) % p.path.total;
    let seg = p.path.segs[0];
    for (const s of p.path.segs) {
      if (p.dist >= s.start && p.dist <= s.start + s.len) { seg = s; break; }
    }
    const t = (p.dist - seg.start) / Math.max(0.001, seg.len);
    const x = seg.a.x + (seg.b.x - seg.a.x) * t;
    const z = seg.a.y + (seg.b.y - seg.a.y) * t;
    const phase = p.phase + p.dist * 2.0;
    const bob = Math.abs(Math.sin(phase)) * 0.05;

    p.group.position.set(x, BASE + bob, z);
    p.group.rotation.y = Math.atan2(seg.b.x - seg.a.x, seg.b.y - seg.a.y);

    p.legL.rotation.x = Math.sin(phase) * 0.55;
    p.legR.rotation.x = -Math.sin(phase) * 0.55;
    p.armL.rotation.x = -Math.sin(phase) * 0.4;
    p.armR.rotation.x = Math.sin(phase) * 0.4;

    p.blob.position.x = x;
    p.blob.position.z = z;
    if (p.umbrella) p.umbrella.visible = weather.rain > 0.5;
  }
}

const _labelV = new THREE.Vector3();
const _camDir = new THREE.Vector3();

function measureLabels() {
  for (const L of labels) {
    L.w = L.el.offsetWidth || 66;
    L.h = L.el.offsetHeight || 26;
  }
}
measureLabels();

function updateLabels() {
  camera.updateMatrixWorld();
  camera.getWorldDirection(_camDir);
  const w = innerWidth, h = innerHeight;
  const visible = [];

  for (const L of labels) {
    L.line.setAttribute('opacity', '0');
    L.dot.setAttribute('opacity', '0');
    _labelV.copy(L.pos).sub(camera.position);
    if (_labelV.dot(_camDir) < 6) {
      L.el.style.opacity = '0';
      continue;
    }
    _labelV.copy(L.pos).project(camera);
    const px = (_labelV.x * 0.5 + 0.5) * w;
    const py = (-_labelV.y * 0.5 + 0.5) * h;
    if (_labelV.z < 1 && px > -80 && px < w + 80 && py > 90 && py < h - 26) {
      L.px = px;
      L.py = py;
      visible.push(L);
    } else {
      L.el.style.opacity = '0';
    }
  }

  visible.sort((a, b) => (b.main ? 1 : 0) - (a.main ? 1 : 0) || b.py - a.py);
  const placed = [];

  for (const L of visible) {
    const lw = L.w, lh = L.h;
    const baseLeft = L.px - lw / 2;
    const baseTop = L.py - lh;
    const stepY = lh + 8;
    const stepX = lw + 14;
    const candidates = [
      [0, 0], [0, -stepY], [stepX, 0], [-stepX, 0],
      [stepX, -stepY], [-stepX, -stepY], [0, -stepY * 2],
      [stepX, -stepY * 2], [-stepX, -stepY * 2], [0, -stepY * 3],
      [stepX, -stepY * 3], [-stepX, -stepY * 3], [0, -stepY * 4]
    ];

    let left = baseLeft, top = baseTop;
    let found = false;
    for (const [dx, dy] of candidates) {
      const l = baseLeft + dx;
      const t = baseTop + dy;
      if (l < 8 || l + lw > w - 8 || t < 78 || t + lh > h - 8) continue;
      const hits = placed.some(r =>
        l < r.right + 8 && l + lw > r.left - 8 &&
        t < r.bottom + 6 && t + lh > r.top - 6
      );
      if (!hits) {
        left = l; top = t; found = true; break;
      }
    }
    if (!found) {
      top = Math.max(78, baseTop - stepY * 5);
      left = Math.min(Math.max(8, baseLeft), w - lw - 8);
    }
    placed.push({ left, right: left + lw, top, bottom: top + lh });

    L.el.style.transform = `translate(${left}px, ${top}px)`;
    L.el.style.zIndex = String(1000 - Math.round(L.py));
    L.el.style.opacity = '0.94';

    L.line.setAttribute('x1', left + lw / 2);
    L.line.setAttribute('y1', top + lh);
    L.line.setAttribute('x2', L.px);
    L.line.setAttribute('y2', L.py);
    L.line.setAttribute('opacity', '0.55');
    L.dot.setAttribute('cx', L.px);
    L.dot.setAttribute('cy', L.py);
    L.dot.setAttribute('opacity', '0.9');
  }
}

  for (const m of snowGroundMeshes) m.visible = snowVisible;

  /* 植物覆雪 */
  MAT.leaf1.color.copy(LEAF_BASE[0]).lerp(COLORS.leafSnow, s * 0.55);
  MAT.leaf2.color.copy(LEAF_BASE[1]).lerp(COLORS.leafSnow, s * 0.55);
  MAT.leaf3.color.copy(LEAF_BASE[2]).lerp(COLORS.leafSnow, s * 0.55);
  MAT.leaf4.color.copy(LEAF_BASE[3]).lerp(COLORS.leafSnow, s * 0.55);
  MAT.blossom1.color.setHex(0xd9a9ac).lerp(COLORS.leafSnow, s * 0.45);
  MAT.blossom2.color.setHex(0xc48692).lerp(COLORS.leafSnow, s * 0.45);
  MAT.shrub.color.copy(COLORS.white).lerp(COLORS.leafSnow, s * 0.35);
  flowerMesh.visible = s < 0.55;

  /* 窗、门、灯 */
  MAT.window.emissiveIntensity = 0.05 + 1.25 * k;
  MAT.door.emissiveIntensity = 0.9 * k;
  for (const pm of plaqueMats) pm.emissiveIntensity = 0.9 * k;
  lanternMat.emissiveIntensity = 0.15 + 2.2 * k;
  lanternGlowMat.opacity = 0.06 + 0.58 * k;
  for (const l of nightLights) l.intensity = 500 * k;
  flashLight.intensity = flash * (0.7 + 1.3 * k);

  /* 粒子 */
  rainMat.opacity = 0.56 * r;
  rainMesh.visible = r > 0.015;
  snowMat.opacity = 0.95 * s;
  snowPoints.visible = s > 0.015;

  renderer.toneMappingExposure = 1.05 - 0.1 * k - 0.08 * r + 0.015 * s;
}

function applyTheme(t) {
  theme.t = t;
  theme.target = t;
  applyEnvironment();
}
applyEnvironment();

function updateRain(dt) {
  if (!rainMesh.visible) return;
  const pos = rainGeo.attributes.position.array;
  for (let i = 0; i < RAIN_COUNT; i++) {
    const d = rainDrops[i];
    d.y -= d.speed * dt;
    d.x += d.wind * dt;
    if (d.y < -4 || d.x > 275) {
      d.x = -270 + rand() * 540;
      d.y = 150 + rand() * 30;
      d.z = -345 + rand() * 690;
    }
    const o = i * 6;
    pos[o] = d.x;
    pos[o + 1] = d.y;
    pos[o + 2] = d.z;
    pos[o + 3] = d.x + 0.65;
    pos[o + 4] = d.y + d.len;
    pos[o + 5] = d.z - 0.2;
  }
  rainGeo.attributes.position.needsUpdate = true;
}

function updateSnow(dt, time) {
  if (!snowPoints.visible) return;
  const pos = snowGeo.attributes.position.array;
  for (let i = 0; i < SNOW_COUNT; i++) {
    const d = snowData[i];
    d.y -= d.speed * dt;
    if (d.y < -2) {
      d.y = 155 + rand() * 25;
      d.x0 = -280 + rand() * 560;
      d.z = -345 + rand() * 690;
    }
    const o = i * 3;
    pos[o] = d.x0 + Math.sin(time * 0.55 + d.phase) * 3.2;
    pos[o + 1] = d.y;
    pos[o + 2] = d.z + Math.cos(time * 0.35 + d.phase) * 1.2;
  }
  snowGeo.attributes.position.needsUpdate = true;
}

function updateTrees(time) {
  for (const t of trees) {
    const sway = 0.008 + 0.006 * weather.rain + 0.004 * weather.snow;
    t.rotation.z = Math.sin(time * 0.55 + t.userData.phase) * sway;
    t.rotation.x = Math.cos(time * 0.43 + t.userData.phase * 1.3) * sway * 0.5;
  }
}

/* ============================================================
   视角
   ============================================================ */
function defaultView() {
  const aspect = innerWidth / innerHeight;
  if (aspect < 0.8) {
    return { pos: new THREE.Vector3(365, 265, 760), target: new THREE.Vector3(0, 16, 45) };
  }
  if (aspect < 1.25) {
    return { pos: new THREE.Vector3(255, 165, 540), target: new THREE.Vector3(0, 16, 45) };
  }
  return { pos: new THREE.Vector3(285, 185, 590), target: new THREE.Vector3(0, 16, 45) };
}

const initView = defaultView();
camera.position.copy(initView.pos);
controls.target.copy(initView.target);
controls.update();
window.__fc = {
  scene, camera, controls, renderer,
  applyTheme, applyEnvironment, theme, weather, setWeatherMode, people, trees
};

let camAnim = null;
function resetView() {
  const v = defaultView();
  camAnim = {
    fp: camera.position.clone(),
    tp: v.pos,
    ft: controls.target.clone(),
    tt: v.target,
    t: 0
  };
}
function easeInOutCubic(t) {
  return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
}

/* ============================================================
   UI
   ============================================================ */
const btnRotate = document.getElementById('btnRotate');
const btnWeather = document.getElementById('btnWeather');
const btnLabels = document.getElementById('btnLabels');
const btnReset = document.getElementById('btnReset');
const btnNight = document.getElementById('btnNight');

btnRotate.addEventListener('click', () => {
  controls.autoRotate = !controls.autoRotate;
  btnRotate.classList.toggle('on', controls.autoRotate);
  btnRotate.textContent = controls.autoRotate ? '停止巡游' : '自动巡游';
});

const WEATHER_MODES = [
  { key: 'sunny', label: '晴' },
  { key: 'rain', label: '雨' },
  { key: 'snow', label: '雪' }
];
let weatherIndex = 0;

function setWeatherMode(mode) {
  weather.mode = mode;
  weather.targetRain = mode === 'rain' ? 1 : 0;
  weather.targetSnow = mode === 'snow' ? 1 : 0;
  const item = WEATHER_MODES.find(w => w.key === mode) || WEATHER_MODES[0];
  btnWeather.textContent = '天气：' + item.label;
  btnWeather.classList.toggle('on', mode !== 'sunny');
}

btnWeather.addEventListener('click', () => {
  weatherIndex = (weatherIndex + 1) % WEATHER_MODES.length;
  setWeatherMode(WEATHER_MODES[weatherIndex].key);
});

let labelsOn = true;
btnLabels.addEventListener('click', () => {
  labelsOn = !labelsOn;
  labelLayer.style.display = labelsOn ? '' : 'none';
  leadersSvg.style.display = labelsOn ? '' : 'none';
  btnLabels.textContent = labelsOn ? '隐藏标注' : '显示标注';
  btnLabels.classList.toggle('on', !labelsOn);
});

btnReset.addEventListener('click', resetView);

let isNight = false;
btnNight.addEventListener('click', () => {
  isNight = !isNight;
  theme.target = isNight ? 1 : 0;
  btnNight.classList.toggle('on', isNight);
  btnNight.textContent = isNight ? '日景' : '夜景';
});

/* ============================================================
   循环
   ============================================================ */
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  measureLabels();
});

const clock = new THREE.Clock();
let firstFrame = true;

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const time = performance.now() * 0.001;

  if (Math.abs(theme.t - theme.target) > 0.0005) {
    theme.t += (theme.target - theme.t) * Math.min(1, dt * 3.2);
  } else {
    theme.t = theme.target;
  }

  const wLerp = Math.min(1, dt * 2.1);
  weather.rain += (weather.targetRain - weather.rain) * wLerp;
  weather.snow += (weather.targetSnow - weather.snow) * wLerp;
  if (Math.abs(weather.rain - weather.targetRain) < 0.002) weather.rain = weather.targetRain;
  if (Math.abs(weather.snow - weather.targetSnow) < 0.002) weather.snow = weather.targetSnow;

  if (weather.rain > 0.25) {
    lightningTimer -= dt;
    if (lightningTimer <= 0) {
      flash = 1;
      lightningTimer = 7 + rand() * 11;
    }
  } else {
    lightningTimer = 5 + rand() * 7;
  }
  flash *= Math.exp(-dt * 7.5);

  updateRain(dt);
  updateSnow(dt, time);
  updateTrees(time);
  updatePeople(dt, time);

  waterTex.offset.x += dt * 0.008;
  waterTex.offset.y += dt * 0.004;

  const glow = 0.85 + Math.sin(time * 2.0) * 0.15;
  for (const l of lanterns) {
    l.children[0].scale.set(glow, 1.24 * glow, glow);
  }

  if (camAnim) {
    camAnim.t += dt / 1.2;
    const s = easeInOutCubic(Math.min(1, camAnim.t));
    camera.position.lerpVectors(camAnim.fp, camAnim.tp, s);
    controls.target.lerpVectors(camAnim.ft, camAnim.tt, s);
    if (camAnim.t >= 1) camAnim = null;
  }

  controls.update();
  applyEnvironment();
  updateLabels();
  renderer.render(scene, camera);

  if (firstFrame) {
    firstFrame = false;
    renderer.shadowMap.autoUpdate = false;
    setTimeout(() => {
      const loading = document.getElementById('loading');
      loading.classList.add('hide');
      setTimeout(() => { loading.style.display = 'none'; }, 1000);
    }, 450);
  }
}
animate();
</script>

<script>
  setTimeout(function () {
    var el = document.getElementById('loading');
    if (el && !el.classList.contains('hide')) {
      var sub = document.getElementById('loadSub');
      if (sub) sub.textContent = '加载时间较长，请检查网络连接（Three.js 通过 CDN 加载）';
    }
  }, 12000);
</script>
