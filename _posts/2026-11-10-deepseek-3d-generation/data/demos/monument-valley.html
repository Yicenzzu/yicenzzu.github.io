<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>回音花园 · The Echo Garden</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%23171123'/%3E%3Cpath d='M32 9 55 32 32 55 9 32Z' fill='none' stroke='%23f1c777' stroke-width='2'/%3E%3Cpath d='M32 23 41 32 32 41 23 32Z' fill='%23f1c777'/%3E%3C/svg%3E">
<style>
  :root {
    --gold: #f1c777;
    --gold-bright: #ffe3a7;
    --gold-dim: #9d7747;
    --cream: #f3e8d7;
    --cream-dim: #cdbba5;
    --ink: #171223;
    --ink-soft: #241a33;
    --coral: #e88b72;
    --teal: #7cc8bb;
    --line: rgba(242, 205, 139, 0.26);
    --glass: rgba(20, 14, 31, 0.48);
  }

  * { box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: #100c1a;
    color: var(--cream);
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  button { font: inherit; }

  #app {
    position: fixed;
    inset: 0;
    isolation: isolate;
  }

  #scene {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
    cursor: default;
    outline: none;
  }

  .atmosphere {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 2;
    background:
      radial-gradient(ellipse at 50% 46%, transparent 35%, rgba(9, 6, 16, 0.16) 68%, rgba(7, 5, 13, 0.55) 100%),
      linear-gradient(180deg, rgba(9, 7, 16, 0.12), transparent 16%, transparent 78%, rgba(8, 5, 14, 0.34));
  }

  .atmosphere::after {
    content: "";
    position: absolute;
    inset: 0;
    opacity: 0.2;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.22'/%3E%3C/svg%3E");
    mix-blend-mode: soft-light;
  }

  .hud {
    position: absolute;
    inset: 0;
    z-index: 4;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: clamp(18px, 2.7vw, 42px);
    pointer-events: none;
  }

  .hud-top {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: start;
    gap: 18px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 14px;
    justify-self: start;
    opacity: 0;
    animation: drift-in 1.2s 0.15s cubic-bezier(.2,.8,.2,1) forwards;
  }

  .brand-mark {
    width: 35px;
    height: 35px;
    position: relative;
    flex: 0 0 auto;
    transform: rotate(45deg);
    border: 1px solid rgba(241, 199, 119, 0.72);
  }

  .brand-mark::before {
    content: "";
    position: absolute;
    inset: 6px;
    border: 1px solid rgba(241, 199, 119, 0.4);
  }

  .brand-mark::after {
    content: "";
    position: absolute;
    width: 7px;
    height: 7px;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    background: var(--gold);
    box-shadow: 0 0 16px rgba(241, 199, 119, 0.7);
  }

  .brand h1 {
    margin: 0;
    font-family: "Songti SC", "STSong", "SimSun", Georgia, serif;
    font-size: clamp(19px, 1.8vw, 27px);
    font-weight: 500;
    letter-spacing: 0.22em;
    line-height: 1;
    text-shadow: 0 2px 24px rgba(0, 0, 0, 0.45);
  }

  .brand p {
    margin: 7px 0 0;
    color: rgba(243, 232, 215, 0.48);
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 0.36em;
  }

  .chapter {
    justify-self: center;
    text-align: center;
    padding-top: 3px;
    opacity: 0;
    animation: drift-in 1.2s 0.4s cubic-bezier(.2,.8,.2,1) forwards;
  }

  .chapter .kicker {
    display: block;
    color: var(--gold);
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 0.38em;
    text-transform: uppercase;
    opacity: 0.82;
  }

  .chapter .name {
    display: block;
    margin-top: 7px;
    font-family: "Songti SC", "STSong", "SimSun", Georgia, serif;
    color: rgba(243, 232, 215, 0.78);
    font-size: 14px;
    letter-spacing: 0.3em;
  }

  .top-right {
    justify-self: end;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .sound-btn {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: 1px solid rgba(241, 199, 119, 0.34);
    background: rgba(18, 12, 28, 0.38);
    color: var(--gold);
    display: grid;
    place-items: center;
    cursor: pointer;
    pointer-events: auto;
    transition: border-color .25s, background .25s, transform .25s;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }

  .sound-btn:hover {
    border-color: rgba(241, 199, 119, 0.78);
    background: rgba(36, 25, 47, 0.68);
    transform: translateY(-1px);
  }

  .sound-btn .icon {
    font-family: Georgia, serif;
    font-size: 16px;
    line-height: 1;
    transform: translateY(-1px);
  }

  .sound-btn.muted .icon { opacity: 0.45; }
  .sound-btn.muted .icon::after {
    content: "";
    position: absolute;
    width: 26px;
    height: 1px;
    background: currentColor;
    transform: rotate(-45deg);
    transform-origin: center;
    margin-left: -13px;
    margin-top: 7px;
  }

  .hud-bottom {
    display: grid;
    grid-template-columns: minmax(180px, 1fr) auto minmax(90px, 1fr);
    align-items: end;
    gap: 24px;
  }

  .guide {
    justify-self: start;
    min-width: 190px;
    opacity: 0;
    animation: drift-in 1.2s 0.7s cubic-bezier(.2,.8,.2,1) forwards;
  }

  .objective-row {
    display: flex;
    align-items: center;
    gap: 10px;
    color: rgba(243, 232, 215, 0.86);
    font-size: 12px;
    letter-spacing: 0.14em;
  }

  .objective-row .bead {
    width: 7px;
    height: 7px;
    transform: rotate(45deg);
    background: var(--gold);
    box-shadow: 0 0 12px rgba(241, 199, 119, 0.62);
    flex: 0 0 auto;
  }

  .objective-row .obj-copy { white-space: nowrap; }

  .guide-rule {
    height: 1px;
    width: 100%;
    margin: 13px 0 11px;
    background: linear-gradient(90deg, rgba(241, 199, 119, 0.38), rgba(241, 199, 119, 0.03));
  }

  .guide-line {
    color: rgba(243, 232, 215, 0.38);
    font-size: 10px;
    line-height: 1.8;
    letter-spacing: 0.1em;
  }

  .guide-line b {
    color: rgba(241, 199, 119, 0.66);
    font-weight: 500;
  }

  .hint-wrap {
    justify-self: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 9px;
    width: min(560px, 52vw);
    opacity: 0;
    animation: drift-in 1.2s 0.9s cubic-bezier(.2,.8,.2,1) forwards;
  }

  .hint-pill {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    min-height: 42px;
    padding: 10px 22px;
    border: 1px solid rgba(241, 199, 119, 0.22);
    border-radius: 999px;
    background: rgba(17, 12, 27, 0.52);
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.18), inset 0 1px 0 rgba(255, 255, 255, 0.03);
    backdrop-filter: blur(13px);
    -webkit-backdrop-filter: blur(13px);
    color: rgba(243, 232, 215, 0.8);
    font-size: 12px;
    letter-spacing: 0.08em;
    text-align: center;
    transition: border-color .4s, background .4s;
  }

  .hint-pill.active {
    border-color: rgba(241, 199, 119, 0.48);
    background: rgba(35, 24, 43, 0.62);
  }

  .hint-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--gold);
    box-shadow: 0 0 0 0 rgba(241, 199, 119, 0.35);
    animation: pulse-ring 2.6s infinite;
    flex: 0 0 auto;
  }

  .toast {
    max-width: 360px;
    padding: 7px 16px;
    border: 1px solid rgba(241, 199, 119, 0.24);
    border-radius: 999px;
    background: rgba(22, 15, 33, 0.56);
    color: var(--gold-bright);
    font-size: 11px;
    letter-spacing: 0.12em;
    text-align: center;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    opacity: 0;
    transform: translateY(5px);
    transition: opacity .3s, transform .3s;
  }

  .toast.show {
    opacity: 0.96;
    transform: translateY(0);
  }

  .steps {
    justify-self: end;
    display: flex;
    align-items: baseline;
    gap: 7px;
    padding-bottom: 2px;
    opacity: 0;
    animation: drift-in 1.2s 1.05s cubic-bezier(.2,.8,.2,1) forwards;
  }

  .steps .num {
    font-family: Georgia, "Times New Roman", serif;
    color: rgba(241, 199, 119, 0.86);
    font-size: 25px;
    font-variant-numeric: tabular-nums;
    line-height: 1;
    letter-spacing: 0.03em;
  }

  .steps small {
    color: rgba(243, 232, 215, 0.34);
    font-size: 9px;
    letter-spacing: 0.26em;
  }

  .progress-pips {
    display: inline-flex;
    gap: 5px;
    margin-left: 5px;
    vertical-align: middle;
  }

  .progress-pips i {
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: rgba(243, 232, 215, 0.18);
    transition: background .45s, box-shadow .45s;
  }

  .progress-pips i.done {
    background: var(--gold);
    box-shadow: 0 0 8px rgba(241, 199, 119, 0.75);
  }

  .win-layer {
    position: absolute;
    inset: 0;
    z-index: 20;
    display: grid;
    place-items: center;
    padding: 24px;
    background: radial-gradient(circle at 50% 44%, rgba(26, 19, 38, 0.45), rgba(8, 6, 14, 0.88));
    backdrop-filter: blur(7px);
    -webkit-backdrop-filter: blur(7px);
    opacity: 0;
    visibility: hidden;
    transition: opacity 1s cubic-bezier(.2,.8,.2,1), visibility 1s;
  }

  .win-layer.show {
    opacity: 1;
    visibility: visible;
  }

  .win-card {
    position: relative;
    width: min(430px, 88vw);
    padding: 43px 38px 36px;
    text-align: center;
    border: 1px solid rgba(241, 199, 119, 0.38);
    background:
      linear-gradient(145deg, rgba(41, 29, 51, 0.92), rgba(18, 13, 28, 0.94)),
      radial-gradient(circle at 50% 0%, rgba(241, 199, 119, 0.16), transparent 55%);
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.52), inset 0 1px 0 rgba(255, 255, 255, 0.04);
    transform: translateY(18px) scale(0.97);
    transition: transform 1s cubic-bezier(.2,.8,.2,1);
  }

  .win-layer.show .win-card { transform: translateY(0) scale(1); }

  .win-card::before,
  .win-card::after {
    content: "";
    position: absolute;
    width: 38px;
    height: 38px;
    border-color: rgba(241, 199, 119, 0.58);
    border-style: solid;
    pointer-events: none;
  }

  .win-card::before {
    left: 11px;
    top: 11px;
    border-width: 1px 0 0 1px;
  }

  .win-card::after {
    right: 11px;
    bottom: 11px;
    border-width: 0 1px 1px 0;
  }

  .win-glyph {
    width: 45px;
    height: 45px;
    margin: 0 auto 22px;
    transform: rotate(45deg);
    border: 1px solid rgba(241, 199, 119, 0.7);
    display: grid;
    place-items: center;
    box-shadow: 0 0 30px rgba(241, 199, 119, 0.16);
  }

  .win-glyph span {
    width: 11px;
    height: 11px;
    background: var(--gold);
    box-shadow: 0 0 18px rgba(255, 224, 162, 0.8);
  }

  .win-kicker {
    margin: 0;
    color: var(--gold);
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 0.42em;
  }

  .win-card h2 {
    margin: 15px 0 12px;
    font-family: "Songti SC", "STSong", "SimSun", Georgia, serif;
    font-size: clamp(28px, 4vw, 38px);
    font-weight: 400;
    letter-spacing: 0.17em;
  }

  .win-card p {
    margin: 0 auto;
    max-width: 300px;
    color: rgba(243, 232, 215, 0.57);
    font-size: 12px;
    line-height: 1.9;
    letter-spacing: 0.08em;
  }

  .win-stats {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 30px;
    margin: 27px 0 28px;
    padding: 18px 0;
    border-top: 1px solid rgba(241, 199, 119, 0.14);
    border-bottom: 1px solid rgba(241, 199, 119, 0.14);
  }

  .win-stat {
    display: flex;
    flex-direction: column;
    gap: 7px;
    min-width: 64px;
  }

  .win-stat span {
    color: rgba(243, 232, 215, 0.35);
    font-size: 9px;
    letter-spacing: 0.22em;
  }

  .win-stat b {
    color: var(--gold-bright);
    font-family: Georgia, "Times New Roman", serif;
    font-size: 22px;
    font-weight: 400;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.04em;
  }

  .replay-btn {
    position: relative;
    min-width: 160px;
    padding: 12px 26px;
    border: 1px solid rgba(241, 199, 119, 0.54);
    background: transparent;
    color: var(--gold-bright);
    font-size: 11px;
    letter-spacing: 0.24em;
    cursor: pointer;
    transition: background .25s, color .25s, border-color .25s;
  }

  .replay-btn:hover {
    background: var(--gold);
    border-color: var(--gold);
    color: #20162b;
  }

  @keyframes drift-in {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes pulse-ring {
    0% { box-shadow: 0 0 0 0 rgba(241, 199, 119, 0.38); }
    55% { box-shadow: 0 0 0 7px rgba(241, 199, 119, 0); }
    100% { box-shadow: 0 0 0 0 rgba(241, 199, 119, 0); }
  }

  @media (max-width: 760px) {
    .hud { padding: 18px; }
    .hud-top { grid-template-columns: 1fr auto; }
    .chapter { display: none; }
    .brand { gap: 10px; }
    .brand-mark { width: 27px; height: 27px; }
    .brand-mark::before { inset: 4px; }
    .brand h1 { font-size: 18px; letter-spacing: 0.17em; }
    .brand p { font-size: 7px; letter-spacing: 0.25em; }
    .sound-btn { width: 34px; height: 34px; }
    .hud-bottom { grid-template-columns: 1fr auto; gap: 12px; }
    .guide { display: none; }
    .hint-wrap { grid-column: 1 / 2; justify-self: stretch; width: auto; }
    .hint-pill { min-height: 40px; padding: 9px 16px; font-size: 11px; }
    .steps { grid-column: 2 / 3; align-self: end; }
    .steps .num { font-size: 21px; }
    .win-card { padding: 35px 24px 30px; }
  }

  @media (max-height: 520px) {
    .chapter { display: none; }
    .guide { display: none; }
    .hud-bottom { grid-template-columns: 1fr auto; }
    .hint-wrap { grid-column: 1 / 2; width: auto; justify-self: stretch; }
    .steps { grid-column: 2 / 3; }
  }
</style>
</head>
<body>
<div id="app">
  <canvas id="scene" aria-label="回音花园：一座等距视角的视错觉解谜花园。点击石板行走，靠近金色的轮盘并点击它来转动断桥。"></canvas>
  <div class="atmosphere"></div>

  <div class="hud">
    <div class="hud-top">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"></div>
        <div>
          <h1>回音花园</h1>
          <p>THE ECHO GARDEN</p>
        </div>
      </div>

      <div class="chapter">
        <span class="kicker">Chapter I</span>
        <span class="name">静默的桥</span>
      </div>

      <div class="top-right">
        <button id="soundBtn" class="sound-btn" type="button" aria-label="关闭声音" title="声音">
          <span class="icon" aria-hidden="true">♪</span>
        </button>
      </div>
    </div>

    <div class="hud-bottom">
      <div class="guide">
        <div class="objective-row">
          <span class="bead" aria-hidden="true"></span>
          <span class="obj-copy" id="objective">修复断桥</span>
          <span class="progress-pips" aria-hidden="true">
            <i id="pip0"></i><i id="pip1"></i><i id="pip2"></i>
          </span>
        </div>
        <div class="guide-rule"></div>
        <div class="guide-line">
          <b>点击石板</b> 让旅人行走　·　<b>靠近金轮</b> 点击转动机关
        </div>
      </div>

      <div class="hint-wrap">
        <div class="toast" id="toast" role="status" aria-live="polite"></div>
        <div class="hint-pill" id="hintPill">
          <span class="hint-dot" aria-hidden="true"></span>
          <span id="hintText">点击石板，让旅人开始行走</span>
        </div>
      </div>

      <div class="steps" aria-label="行走步数">
        <span class="num" id="stepCount">00</span>
        <small>步</small>
      </div>
    </div>
  </div>

  <div class="win-layer" id="winLayer" aria-hidden="true">
    <div class="win-card" role="dialog" aria-modal="true" aria-labelledby="winTitle">
      <div class="win-glyph" aria-hidden="true"><span></span></div>
      <p class="win-kicker">THE PATH IS WHOLE</p>
      <h2 id="winTitle">回音归于寂静</h2>
      <p>你让断裂的桥重新记起了方向。<br>晚风穿过拱门，花园又完整了一次。</p>
      <div class="win-stats">
        <div class="win-stat"><span>步数</span><b id="winSteps">0</b></div>
        <div class="win-stat"><span>用时</span><b id="winTime">0:00</b></div>
      </div>
      <button class="replay-btn" id="replayBtn" type="button">再走一次</button>
    </div>
  </div>
</div>

<script>
(() => {
  "use strict";

  // ─────────────────────────────────────────────────────────────
  //  Scene data
  // ─────────────────────────────────────────────────────────────

  const ISO_X = Math.sqrt(3) / 2;
  const ISO_Y = 0.5;
  const TAU = Math.PI * 2;

  const fixedNodes = [
    { id: "p0",  x: 1,  y: 0,    z: 3,  kind: "start", support: 0.18 },
    { id: "p1",  x: 2,  y: 0,    z: 3,  support: 0.18 },
    { id: "p2",  x: 3,  y: 0,    z: 3,  support: 0.18 },
    { id: "p3",  x: 7,  y: 0,    z: 3,  support: 0.18 },
    { id: "p4",  x: 8,  y: 0,    z: 3,  support: 0.18 },
    { id: "p5",  x: 8,  y: 0.5,  z: 4,  support: 0.58 },
    { id: "p6",  x: 8,  y: 1.0,  z: 5,  support: 0.58 },
    { id: "p7",  x: 8,  y: 1.5,  z: 6,  support: 0.30 },
    { id: "p8",  x: 9,  y: 1.5,  z: 6,  support: 0.18 },
    { id: "p9",  x: 13, y: 1.5,  z: 6,  support: 0.18 },
    { id: "p10", x: 14, y: 1.5,  z: 6,  kind: "goal", support: 0.18 }
  ];

  const fixedEdges = [
    ["p0", "p1"], ["p1", "p2"],
    ["p3", "p4"], ["p4", "p5"], ["p5", "p6"], ["p6", "p7"], ["p7", "p8"],
    ["p9", "p10"]
  ];

  const platforms = [
    {
      id: "start",
      topY: -0.12,
      depth: 1.45,
      taper: 0.74,
      points: [[0.0,2.15],[3.12,2.15],[3.62,2.56],[3.62,3.52],[3.18,3.95],[0.0,3.95]],
      colors: { topA: "#eedec7", topB: "#d2b596", sideA: "#8f6b5a", sideB: "#5c4554" }
    },
    {
      id: "central",
      topY: -0.12,
      depth: 1.35,
      taper: 0.72,
      points: [[6.12,2.65],[8.92,2.65],[9.52,3.18],[9.44,4.25],[8.78,4.58],[6.72,4.48],[6.12,3.82]],
      colors: { topA: "#efddc3", topB: "#d4b390", sideA: "#8f6856", sideB: "#574151" }
    },
    {
      id: "terrace",
      topY: 1.38,
      depth: 1.16,
      taper: 0.76,
      points: [[7.12,5.34],[9.55,5.34],[9.78,5.72],[9.68,6.67],[8.94,7.0],[7.34,6.93],[7.06,6.20]],
      colors: { topA: "#f1e0c7", topB: "#d8b895", sideA: "#956d58", sideB: "#5d4554" }
    },
    {
      id: "goal",
      topY: 1.38,
      depth: 1.52,
      taper: 0.71,

  // ─────────────────────────────────────────────────────────────
  //  Tiny helpers
  // ─────────────────────────────────────────────────────────────

  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const easeOutCubic = t => 1 - Math.pow(1 - t, 3);
  const easeInOutCubic = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

  let seed = 8731;
  function random() {
    seed = (seed * 16807) % 2147483647;
    return (seed - 1) / 2147483646;
  }

  function project(x, y, z) {
    return {
      x: view.ox + (x - z) * ISO_X * view.S,
      y: view.oy + (x + z) * ISO_Y * view.S - y * view.S
    };
  }

  function nodePosition(id) {
    if (id.startsWith("bridge-")) {
      const [, bid, idxRaw] = id.split("-");
      const b = bridges.find(x => x.id === bid);
      if (!b) return { x: 0, y: 0, z: 0 };
      return bridgeNodePosition(b, Number(idxRaw));
    }
    const n = nodeById.get(id);
    return n ? { x: n.x, y: n.y, z: n.z } : { x: 0, y: 0, z: 0 };
  }

  function bridgeLift(b) {
    return 0.58 * Math.abs(Math.sin(b.angle));
  }

  function bridgeVisualY(b) {
    return b.cy + bridgeLift(b);
  }

  function bridgeNodePosition(b, index) {
    const offset = index - (b.length - 1) / 2;
    const c = Math.cos(b.angle);
    const s = Math.sin(b.angle);
    return {
      x: b.cx + c * offset * 1.0,
      y: bridgeVisualY(b),
      z: b.cz + s * offset * 1.0
    };
  }

  function allBridgeNodes(b) {
    const arr = [];
    for (let i = 0; i < b.length; i++) {
      const p = bridgeNodePosition(b, i);
      arr.push({ id: "bridge-" + b.id + "-" + i, x: p.x, y: p.y, z: p.z, kind: "bridge", bridge: b.id });
    }
    return arr;
  }

  function bridgeAligned(b) {
    return !b.rotating && Math.abs(Math.sin(b.angle)) < 0.04;
  }

  function bridgeIsVertical(b) {
    return Math.abs(Math.cos(b.angle)) < 0.08;
  }

  function playerOnBridge() {
    return player.nodeId.startsWith("bridge-");
  }

  function bridgeIdOfPlayer() {
    if (!playerOnBridge()) return null;
    return player.nodeId.split("-")[1];
  }

  function currentPlayerPosition() {
    return { x: player.x, y: player.y, z: player.z };
  }

  function distanceXZ(a, b) {
    return Math.hypot(a.x - b.x, a.z - b.z);
  }

  function gearWorld(b) {
    return { x: b.cx, y: bridgeVisualY(b) + b.gearY, z: b.cz };
  }

  function gearInReach(b) {
    const p = currentPlayerPosition();
    return distanceXZ(p, { x: b.cx, z: b.cz }) <= b.reach && Math.abs(p.y - b.cy) < 0.9;
  }

  // ─────────────────────────────────────────────────────────────
  //  Audio
  // ─────────────────────────────────────────────────────────────

  const Sound = {
    ctx: null,
    muted: false,
    init() {
      if (this.ctx) return;
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      try { this.ctx = new AC(); } catch (_) { this.ctx = null; }
    },
    tone(freq, dur, type, gain, delay) {
      if (this.muted || !this.ctx) return;
      const t0 = this.ctx.currentTime + (delay || 0);
      const osc = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      osc.type = type || "sine";
      osc.frequency.setValueAtTime(freq, t0);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(gain || 0.025, t0 + 0.018);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      osc.connect(g).connect(this.ctx.destination);
      osc.start(t0);
      osc.stop(t0 + dur + 0.03);
    },
    step() {
      this.init();
      this.tone(350 + random() * 90, 0.07, "triangle", 0.008);
    },
    turn() {
      this.init();
      this.tone(196, 0.32, "sine", 0.022, 0);
      this.tone(294, 0.30, "sine", 0.018, 0.08);
      this.tone(392, 0.36, "sine", 0.014, 0.16);
    },
    connect() {
      this.init();
      this.tone(587.33, 0.55, "sine", 0.022, 0);
      this.tone(880, 0.55, "sine", 0.014, 0.08);
      this.tone(1174.66, 0.65, "sine", 0.009, 0.16);
    },
    deny() {
      this.init();
      this.tone(146.83, 0.12, "sine", 0.012, 0);
    },
    win() {
      this.init();
      const notes = [261.63, 329.63, 392.0, 523.25, 659.25, 783.99];
      notes.forEach((n, i) => this.tone(n, 1.7, "sine", 0.018 - i * 0.0015, i * 0.15));
      this.tone(1046.5, 2.0, "sine", 0.008, 0.9);
    }
  };

  // ─────────────────────────────────────────────────────────────
  //  Layout / camera
  // ─────────────────────────────────────────────────────────────

  function computeCamera() {
    let minU = Infinity, maxU = -Infinity, minV = Infinity, maxV = -Infinity;
    const sample = (x, y, z) => {
      const u = (x - z) * ISO_X;
      const v = (x + z) * ISO_Y - y;
      if (u < minU) minU = u;
      if (u > maxU) maxU = u;
      if (v < minV) minV = v;
      if (v > maxV) maxV = v;
    };

    fixedNodes.forEach(n => {
      sample(n.x, n.y + 0.12, n.z);
      if (n.support) sample(n.x, n.y - n.support, n.z);
    });

    platforms.forEach(p => {
      p.points.forEach(([x, z]) => {
        sample(x, p.topY, z);
        sample(x, p.topY - p.depth, z);
      });
    });

    bridges.forEach(b => {
      [0, Math.PI / 2].forEach(angle => {
        const c = Math.cos(angle), s = Math.sin(angle);
        [-1.6, 1.6].forEach(off => {
          const cx = b.cx + c * off;
          const cz = b.cz + s * off;
          sample(cx - 0.55, b.cy, cz - 0.55);
          sample(cx + 0.55, b.cy, cz + 0.55);
          sample(cx - 0.55, b.cy + 0.62, cz - 0.55);
          sample(cx + 0.55, b.cy + 0.62, cz + 0.55);
          sample(cx, b.cy + 0.62 + b.gearY + 0.7, cz);
        });
      });
    });

    sample(14.35, 3.05, 5.42);
    sample(14.35, 3.05, 6.58);
    trees.forEach(t => sample(t.x, t.y + t.h, t.z));

    const spanU = Math.max(0.1, maxU - minU);
    const spanV = Math.max(0.1, maxV - minV);

    const pxFrac = view.w < 700 ? 0.94 : 0.84;
    const pyFrac = view.w < 700 ? 0.64 : 0.69;

    let scale = Math.min((view.w * pxFrac) / spanU, (view.h * pyFrac) / spanV);
    scale = clamp(scale, 25, 84);

    const cu = (minU + maxU) / 2;
    const cv = (minV + maxV) / 2;
    const cyFrac = view.w < 700 ? 0.43 : 0.515;

    view.S = scale;
    view.ox = view.w / 2 - cu * scale;
    view.oy = view.h * cyFrac - cv * scale;
  }

  function resize() {
    const rect = canvas.getBoundingClientRect();
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    view.w = Math.max(1, rect.width);
    view.h = Math.max(1, rect.height);
    view.dpr = dpr;
    canvas.width = Math.round(view.w * dpr);
    canvas.height = Math.round(view.h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    computeCamera();
    initBackgroundParticles();
  }

  // ─────────────────────────────────────────────────────────────
  //  Background
  // ─────────────────────────────────────────────────────────────

  function initBackgroundParticles() {
    if (stars.length === 0) {
      for (let i = 0; i < 130; i++) {
        stars.push({
          x: random(),
          y: random(),
          r: 0.4 + random() * 1.25,
          a: 0.10 + random() * 0.46,
          tw: 0.6 + random() * 2.2,
          ph: random() * TAU
        });
      }
    }
    if (motes.length === 0) {
      for (let i = 0; i < 30; i++) {
        motes.push({
          x: random(),
          y: random(),
          r: 0.7 + random() * 2.2,
          a: 0.06 + random() * 0.17,
          v: 0.006 + random() * 0.014,
          ph: random() * TAU
        });
      }
    }
  }

  function drawBackground() {
    const w = view.w, h = view.h;
    const bg = ctx.createLinearGradient(0, 0, w * 0.25, h);
    bg.addColorStop(0, "#0d0a17");
    bg.addColorStop(0.42, "#1a1229");
    bg.addColorStop(0.74, "#281a32");
    bg.addColorStop(1, "#211423");
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, w, h);

    const halo = ctx.createRadialGradient(w * 0.53, h * 0.46, 0, w * 0.53, h * 0.46, Math.max(w, h) * 0.52);
    halo.addColorStop(0, "rgba(244, 190, 118, 0.115)");
    halo.addColorStop(0.33, "rgba(168, 91, 100, 0.055)");
    halo.addColorStop(0.7, "rgba(85, 62, 124, 0.025)");
    halo.addColorStop(1, "rgba(0, 0, 0, 0)");
    ctx.fillStyle = halo;
    ctx.fillRect(0, 0, w, h);

    // Faint distant geometry.
    ctx.save();
    ctx.globalAlpha = 0.23;
    ctx.strokeStyle = "rgba(238, 198, 140, 0.17)";
    ctx.lineWidth = 1;
    const ringX = w * 0.17;
    const ringY = h * 0.29;
    const ringR = Math.min(w, h) * 0.15;
    ctx.beginPath();
    ctx.arc(ringX, ringY, ringR, -0.42, Math.PI * 1.27);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(ringX, ringY, ringR * 0.72, -0.15, Math.PI * 1.7);
    ctx.stroke();

    ctx.globalAlpha = 0.16;
    const diamondX = w * 0.83;
    const diamondY = h * 0.2;
    const dR = Math.min(w, h) * 0.115;
    ctx.beginPath();
    ctx.moveTo(diamondX, diamondY - dR);
    ctx.lineTo(diamondX + dR * 0.72, diamondY);
    ctx.lineTo(diamondX, diamondY + dR);
    ctx.lineTo(diamondX - dR * 0.72, diamondY);
    ctx.closePath();
    ctx.stroke();
    ctx.restore();

    // Stars.
    ctx.save();
    for (const s of stars) {
      const twinkle = 0.55 + 0.45 * Math.sin(game.time * s.tw + s.ph);
      ctx.globalAlpha = s.a * twinkle;
      ctx.fillStyle = s.r > 1.1 ? "#ffe0b6" : "#d7d1f4";
      ctx.beginPath();
      ctx.arc(s.x * w, s.y * h * 0.82, s.r, 0, TAU);
      ctx.fill();
    }
    ctx.restore();

    // Slanted mist bands.
    ctx.save();
    ctx.globalAlpha = 0.06;
    ctx.fillStyle = "#d5a4a0";
    ctx.beginPath();
    ctx.ellipse(w * 0.28, h * 0.72, w * 0.33, h * 0.05, -0.16, 0, TAU);
    ctx.fill();
    ctx.globalAlpha = 0.042;
    ctx.fillStyle = "#8a9ed1";
    ctx.beginPath();
    ctx.ellipse(w * 0.7, h * 0.34, w * 0.27, h * 0.04, 0.1, 0, TAU);
    ctx.fill();
    ctx.restore();

    // Floating dust.
    ctx.save();
    for (const m of motes) {
      m.y -= m.v * 0.0032;
      if (m.y < -0.03) m.y = 1.03;
      const drift = Math.sin(game.time * 0.35 + m.ph) * 0.012;
      const x = (m.x + drift) * w;
      const y = m.y * h;
      const alpha = m.a * (0.68 + 0.32 * Math.sin(game.time * 0.7 + m.ph));
      ctx.globalAlpha = alpha;
      ctx.fillStyle = "#f4cf91";
      ctx.beginPath();
      ctx.arc(x, y, m.r, 0, TAU);
      ctx.fill();
    }
    ctx.restore();

    // Soft edge glow around board area.
    const edge = ctx.createRadialGradient(w * 0.5, h * 0.51, Math.min(w, h) * 0.12, w * 0.5, h * 0.51, Math.max(w, h) * 0.55);
    edge.addColorStop(0, "rgba(255, 227, 176, 0.0)");
    edge.addColorStop(0.62, "rgba(255, 198, 137, 0.0)");
    edge.addColorStop(1, "rgba(10, 6, 17, 0.34)");
    ctx.fillStyle = edge;
    ctx.fillRect(0, 0, w, h);
  }

  // ─────────────────────────────────────────────────────────────
  //  Geometry drawing
  // ─────────────────────────────────────────────────────────────

  function polygonPath(points) {
    ctx.beginPath();
    ctx.moveTo(points[0].x, points[0].y);
    for (let i = 1; i < points.length; i++) ctx.lineTo(points[i].x, points[i].y);
    ctx.closePath();
  }

  function fillPoly(points, fill, stroke, lineWidth) {
    polygonPath(points);
    if (fill) {
      ctx.fillStyle = fill;
      ctx.fill();
    }
    if (stroke) {
      ctx.strokeStyle = stroke;
      ctx.lineWidth = lineWidth || 1;
      ctx.stroke();
    }
  }

  function drawPlatform(p) {
    const top = p.points.map(([x, z]) => project(x, p.topY, z));
    const cx = p.points.reduce((a, q) => a + q[0], 0) / p.points.length;
    const cz = p.points.reduce((a, q) => a + q[1], 0) / p.points.length;
    const bot = p.points.map(([x, z]) => project(
      cx + (x - cx) * p.taper,
      p.topY - p.depth,
      cz + (z - cz) * p.taper
    ));

    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    top.forEach(q => {
      minX = Math.min(minX, q.x);
      minY = Math.min(minY, q.y);
      maxX = Math.max(maxX, q.x);
      maxY = Math.max(maxY, q.y);
    });

    // Soft reflection beneath the floating island.
    const gx = (minX + maxX) / 2;
    const gy = (minY + maxY) / 2 + (maxY - minY) * 0.6;
    const gr = Math.max(maxX - minX, maxY - minY) * 0.62;
    const glow = ctx.createRadialGradient(gx, gy, gr * 0.05, gx, gy, gr);
    glow.addColorStop(0, "rgba(225, 163, 102, 0.12)");
    glow.addColorStop(0.45, "rgba(115, 95, 148, 0.045)");
    glow.addColorStop(1, "rgba(20, 12, 31, 0)");
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.ellipse(gx, gy, gr * 1.25, gr * 0.34, 0, 0, TAU);
    ctx.fill();

    // Bottom cap.
    fillPoly(bot, "#241a34", "rgba(18, 12, 26, 0.8)", 1);

    // Side faces, sorted back-to-front.
    const faces = [];
    for (let i = 0; i < top.length; i++) {
      const j = (i + 1) % top.length;
      const quad = [top[i], top[j], bot[j], bot[i]];
      const depth = (top[i].y + top[j].y) * 0.5;
      faces.push({ quad, depth, i });
    }
    faces.sort((a, b) => a.depth - b.depth);
    faces.forEach((f, idx) => {
      const t = idx / Math.max(1, faces.length - 1);
      fillPoly(f.quad, t > 0.5 ? p.colors.sideA : p.colors.sideB);
    });

    // Thin strata lines on the front faces.
    ctx.save();
    ctx.globalAlpha = 0.18;
    ctx.strokeStyle = "rgba(247, 211, 167, 0.5)";
    ctx.lineWidth = 0.8;
    for (let i = 0; i < top.length; i++) {
      const j = (i + 1) % top.length;
      if (top[i].y + top[j].y < (minY + maxY)) continue;
      const a = { x: lerp(top[i].x, bot[i].x, 0.32), y: lerp(top[i].y, bot[i].y, 0.32) };
      const b = { x: lerp(top[j].x, bot[j].x, 0.32), y: lerp(top[j].y, bot[j].y, 0.32) };
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(b.x, b.y);
      ctx.stroke();
    }
    ctx.restore();

    // Top face.
    const grad = ctx.createLinearGradient(minX, minY, maxX, maxY);
    grad.addColorStop(0, p.colors.topA);
    grad.addColorStop(1, p.colors.topB);
    polygonPath(top);
    ctx.fillStyle = grad;
    ctx.fill();

    ctx.strokeStyle = "rgba(255, 233, 197, 0.44)";
    ctx.lineWidth = 1.1;
    ctx.stroke();

    // Inset gold rim.
    const rim = top.map(q => ({
      x: gx + (q.x - gx) * 0.9,
      y: (minY + maxY) / 2 + (q.y - (minY + maxY) / 2) * 0.88
    }));
    polygonPath(rim);
    ctx.strokeStyle = "rgba(127, 80, 59, 0.27)";
    ctx.lineWidth = 0.9;
    ctx.stroke();

    // Small floor diamonds.
    ctx.save();
    ctx.globalAlpha = 0.20;
    ctx.fillStyle = "#b1805a";
    const centerTop = project(cx, p.topY + 0.01, cz);
    [0.14, 0.34].forEach((scale, idx) => {
      ctx.beginPath();
      ctx.moveTo(centerTop.x, centerTop.y - 7 * scale * (view.S / 60));
      ctx.lineTo(centerTop.x + 10 * scale * (view.S / 60), centerTop.y);
      ctx.lineTo(centerTop.x, centerTop.y + 7 * scale * (view.S / 60));
      ctx.lineTo(centerTop.x - 10 * scale * (view.S / 60), centerTop.y);
      ctx.closePath();
      if (idx === 0) ctx.fill();
      else ctx.stroke();
    });
    ctx.restore();

    // Little hanging roots under the island.
    ctx.save();
    ctx.globalAlpha = 0.38;
    ctx.strokeStyle = "#a37b62";
    ctx.lineWidth = 1;
    for (let i = 0; i < 3; i++) {
      const rx = gx + (i - 1) * (maxX - minX) * 0.16;
      const ry = gy + (maxY - minY) * 0.06 + i * 4;
      ctx.beginPath();
      ctx.moveTo(rx, ry);
      ctx.quadraticCurveTo(rx + (i - 1) * 5, ry + 13, rx + (i - 1) * 2, ry + 24 + i * 5);
      ctx.stroke();
    }
    ctx.restore();

    // Gold edge glints.
    ctx.save();
    ctx.globalAlpha = 0.65;
    ctx.strokeStyle = "rgba(244, 205, 143, 0.38)";
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.moveTo(top[0].x, top[0].y);
    for (let i = 1; i < top.length; i++) ctx.lineTo(top[i].x, top[i].y);
    ctx.closePath();
    ctx.stroke();
    ctx.restore();
  }

  function drawSupportColumn(x, z, topY, bottomY, width) {
    const top = project(x, topY, z);
    const bottom = project(x, bottomY, z);
    const hw = width * 0.5;
    const corners = [
      project(x + hw, topY, z + hw),
      project(x + hw, topY, z - hw),
      project(x - hw, topY, z - hw),
      project(x - hw, topY, z + hw)
    ];
    const base = [
      project(x + hw, bottomY, z + hw),
      project(x + hw, bottomY, z - hw),
      project(x - hw, bottomY, z - hw),
      project(x - hw, bottomY, z + hw)
    ];

    for (let i = 0; i < 4; i++) {
      const j = (i + 1) % 4;
      fillPoly([corners[i], corners[j], base[j], base[i]], i % 2 ? "#6a4f52" : "#7e5c55");
    }

    // Narrow gold bands.
    [0.22, 0.56, 0.84].forEach(t => {
      const y = lerp(topY, bottomY, t);
      const a = project(x + hw + 0.01, y, z + hw + 0.01);
      const b = project(x - hw - 0.01, y, z + hw + 0.01);
      ctx.strokeStyle = "rgba(235, 190, 126, 0.38)";
      ctx.lineWidth = 1.3;
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(b.x, b.y);
      ctx.stroke();
    });

    // Capital.
    ctx.save();
    ctx.globalAlpha = 0.5;
    ctx.fillStyle = "#362744";
    polygonPath([
      project(x + hw * 1.22, topY - 0.02, z + hw * 1.22),
      project(x + hw * 1.22, topY - 0.02, z - hw * 1.22),
      project(x - hw * 1.22, topY - 0.02, z - hw * 1.22),
      project(x - hw * 1.22, topY - 0.02, z + hw * 1.22)
    ]);
    ctx.fill();
    ctx.restore();
  }

  // ─────────────────────────────────────────────────────────────
  //  Path and bridges
  // ─────────────────────────────────────────────────────────────

  function drawTile(node, index) {
    const { x, y, z } = node;
    const s = view.S;
    const half = 0.5;
    const topPts = [
      project(x + half, y, z + half),
      project(x + half, y, z - half),
      project(x - half, y, z - half),
      project(x - half, y, z + half)
    ];
    const bottomY = y - (node.support || 0.17);
    const botPts = [
      project(x + half, bottomY, z + half),
      project(x + half, bottomY, z - half),
      project(x - half, bottomY, z - half),
      project(x - half, bottomY, z + half)
    ];

    // Shadow / drop under tile.
    const centre = project(x, y, z);
    ctx.save();
    ctx.globalAlpha = 0.22;
    ctx.fillStyle = "#2b1e37";
    ctx.beginPath();
    ctx.ellipse(centre.x + 3, centre.y + s * 0.11, s * 0.43, s * 0.19, 0, 0, TAU);
    ctx.fill();
    ctx.restore();

    // Visible sides.
    fillPoly([topPts[3], topPts[0], botPts[0], botPts[3]], "#a98169");
    fillPoly([topPts[0], topPts[1], botPts[1], botPts[0]], "#8d655a");

    // Top face.
    const grad = ctx.createLinearGradient(
      topPts[2].x, topPts[2].y, topPts[0].x, topPts[0].y
    );
    grad.addColorStop(0, index % 3 === 1 ? "#f7ead7" : "#f2e2ca");
    grad.addColorStop(1, index % 3 === 2 ? "#dfc9aa" : "#ead5b9");
    fillPoly(topPts, grad, "rgba(127, 84, 63, 0.48)", 0.9);

    // Inset diamond.
    const inset = 0.30;
    const inPts = [
      project(x + inset, y + 0.002, z + inset),
      project(x + inset, y + 0.002, z - inset),
      project(x - inset, y + 0.002, z - inset),
      project(x - inset, y + 0.002, z + inset)
    ];
    fillPoly(inPts, "rgba(202, 164, 119, 0.16)", "rgba(172, 124, 85, 0.22)", 0.7);

    // Gold center mark, varied.
    ctx.save();
    ctx.globalAlpha = 0.58;
    ctx.fillStyle = "#d8a755";
    const c = project(x, y + 0.004, z);
    const r = s * 0.048;
    ctx.beginPath();
    if (index % 4 === 0) {
      ctx.arc(c.x, c.y, r, 0, TAU);
    } else {
      ctx.moveTo(c.x, c.y - r * 1.5);
      ctx.lineTo(c.x + r * 1.2, c.y);
      ctx.lineTo(c.x, c.y + r * 1.5);
      ctx.lineTo(c.x - r * 1.2, c.y);
    }
    if (index % 4 === 3) ctx.stroke(); else ctx.fill();
    ctx.restore();

    // Tiny highlight along the upper-left rim.
    ctx.save();
    ctx.globalAlpha = 0.38;
    ctx.strokeStyle = "#fff0d6";
    ctx.lineWidth = 0.8;
    ctx.beginPath();
    ctx.moveTo(topPts[3].x, topPts[3].y);
    ctx.lineTo(topPts[2].x, topPts[2].y);
    ctx.lineTo(topPts[1].x, topPts[1].y);
    ctx.stroke();
    ctx.restore();
  }

  function drawBridgeSpindle(b) {
    const y = bridgeVisualY(b) - 0.24;
    const bottomY = b.cy - 1.35;
    const p = project(b.cx, y, b.cz);
    const q = project(b.cx, bottomY, b.cz);
    const w = 0.13;
    const cornersTop = [
      project(b.cx + w, y, b.cz + w),
      project(b.cx + w, y, b.cz - w),
      project(b.cx - w, y, b.cz - w),
      project(b.cx - w, y, b.cz + w)
    ];
    const cornersBot = [
      project(b.cx + w * 0.7, bottomY, b.cz + w * 0.7),
      project(b.cx + w * 0.7, bottomY, b.cz - w * 0.7),
      project(b.cx - w * 0.7, bottomY, b.cz - w * 0.7),
      project(b.cx - w * 0.7, bottomY, b.cz + w * 0.7)
    ];
    for (let i = 0; i < 4; i++) {
      const j = (i + 1) % 4;
      fillPoly([cornersTop[i], cornersTop[j], cornersBot[j], cornersBot[i]], i % 2 ? "#5e4654" : "#76545a");
    }

    ctx.save();
    ctx.strokeStyle = "rgba(238, 195, 131, 0.45)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
    ctx.lineTo(q.x, q.y);
    ctx.stroke();
    ctx.fillStyle = "rgba(240, 198, 133, 0.65)";
    ctx.beginPath();
    ctx.arc(q.x, q.y, 2.1, 0, TAU);
    ctx.fill();
    ctx.restore();
  }

  function drawBridgeGhost(b) {
    if (bridgeAligned(b)) return;
    const y = b.cy + 0.018;
    const halfL = b.length / 2;
    const halfW = 0.5;
    const corner = (lx, lz) => project(b.cx + lx, y, b.cz + lz);
    const deck = [
      corner(-halfL, -halfW),
      corner(halfL, -halfW),
      corner(halfL, halfW),
      corner(-halfL, halfW)
    ];
    const leftEdge = project(b.cx - halfL, y, b.cz);
    const rightEdge = project(b.cx + halfL, y, b.cz);

    ctx.save();
    ctx.setLineDash([5, 6]);
    ctx.lineDashOffset = -game.time * 12;
    ctx.fillStyle = "rgba(255, 224, 169, 0.065)";
    ctx.strokeStyle = b.rotating ? "rgba(255, 221, 158, 0.16)" : "rgba(255, 218, 154, 0.5)";
    ctx.lineWidth = 1.35;
    polygonPath(deck);
    ctx.fill();
    ctx.stroke();
    // A second dashed centre line makes the missing span read at a glance.
    ctx.beginPath();
    ctx.moveTo(leftEdge.x, leftEdge.y);
    ctx.lineTo(rightEdge.x, rightEdge.y);
    ctx.strokeStyle = "rgba(255, 226, 169, 0.28)";
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.restore();

    // Socket points at both ends of the missing span.
    ctx.save();
    for (const p of [leftEdge, rightEdge]) {
      const pulse = 0.5 + Math.sin(game.time * 2.8 + b.cx) * 0.18;
      ctx.globalAlpha = pulse * (b.rotating ? 0.35 : 0.8);
      ctx.strokeStyle = "rgba(255, 225, 164, 0.78)";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(p.x, p.y, Math.max(3, view.S * 0.07), 0, TAU);
      ctx.stroke();
      ctx.fillStyle = "rgba(255, 224, 161, 0.7)";
      ctx.beginPath();
      ctx.arc(p.x, p.y, Math.max(1.2, view.S * 0.022), 0, TAU);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawBridge(b) {
    const c = Math.cos(b.angle);
    const s = Math.sin(b.angle);
    const ax = { x: c, z: s };
    const px = { x: -s, z: c };
    const halfL = b.length / 2;
    const halfW = 0.5;
    const y = bridgeVisualY(b);
    const thick = 0.27;

    const corner = (lx, lz, yy) => project(
      b.cx + ax.x * lx + px.x * lz,
      yy,
      b.cz + ax.z * lx + px.z * lz
    );

    const top = [
      corner(-halfL, -halfW, y),
      corner(halfL, -halfW, y),
      corner(halfL, halfW, y),
      corner(-halfL, halfW, y)
    ];
    const bot = [
      corner(-halfL, -halfW, y - thick),
      corner(halfL, -halfW, y - thick),
      corner(halfL, halfW, y - thick),
      corner(-halfL, halfW, y - thick)
    ];

    drawBridgeSpindle(b);

    // Underglow reflecting on the abyss.
    const center = project(b.cx, y, b.cz);
    const glow = ctx.createRadialGradient(center.x, center.y + view.S * 0.2, 2, center.x, center.y + view.S * 0.2, view.S * 2.0);
    glow.addColorStop(0, "rgba(240, 193, 116, 0.13)");
    glow.addColorStop(1, "rgba(240, 193, 116, 0)");
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.ellipse(center.x, center.y + view.S * 0.28, view.S * 1.5, view.S * 0.42, 0, 0, TAU);
    ctx.fill();

    // Sides.
    const sideFaces = [
      [top[0], top[1], bot[1], bot[0]],
      [top[1], top[2], bot[2], bot[1]],
      [top[2], top[3], bot[3], bot[2]],
      [top[3], top[0], bot[0], bot[3]]
    ];
    sideFaces
      .map((quad, i) => ({ quad, i, d: (quad[0].y + quad[1].y) * 0.5 }))
      .sort((a, b2) => a.d - b2.d)
      .forEach((f, idx) => fillPoly(f.quad, idx % 2 ? "#9b705e" : "#79565a"));

    // Top deck.
    const grad = ctx.createLinearGradient(top[3].x, top[3].y, top[1].x, top[1].y);
    grad.addColorStop(0, "#f5e5cf");
    grad.addColorStop(1, "#dfc5a4");
    fillPoly(top, grad, "rgba(123, 80, 62, 0.55)", 1);

    // Deck seams.
    ctx.save();
    ctx.strokeStyle = "rgba(139, 94, 67, 0.36)";
    ctx.lineWidth = 0.9;
    for (let i = 1; i < b.length; i++) {
      const lx = -halfL + i;
      const a = corner(lx, -halfW + 0.03, y + 0.006);
      const d = corner(lx, halfW - 0.03, y + 0.006);
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(d.x, d.y);
      ctx.stroke();
    }
    ctx.restore();

    // Center diamonds.
    for (let i = 0; i < b.length; i++) {
      const off = i - (b.length - 1) / 2;
      const h = 0.19;
      const dPts = [
        corner(off + h, -h, y + 0.008),
        corner(off + h, h, y + 0.008),
        corner(off - h, h, y + 0.008),
        corner(off - h, -h, y + 0.008)
      ];
      ctx.save();
      ctx.globalAlpha = 0.46;
      fillPoly(dPts, "rgba(212, 160, 93, 0.38)", "rgba(139, 94, 67, 0.3)", 0.7);
      ctx.restore();
    }

    // Gold edge rails.
    ctx.save();
    ctx.lineCap = "round";
    ctx.strokeStyle = "rgba(237, 191, 117, 0.68)";
    ctx.lineWidth = 1.3;
    [-halfW + 0.055, halfW - 0.055].forEach(lz => {
      const a = corner(-halfL + 0.05, lz, y + 0.07);
      const d = corner(halfL - 0.05, lz, y + 0.07);
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(d.x, d.y);
      ctx.stroke();
    });
    ctx.restore();

    // Rail posts.
    for (let i = 0; i <= b.length; i++) {
      const lx = -halfL + i;
      [-halfW + 0.055, halfW - 0.055].forEach(lz => {
        const p = corner(lx, lz, y + 0.07);
        ctx.fillStyle = "rgba(244, 199, 121, 0.78)";
        ctx.beginPath();
        ctx.arc(p.x, p.y, Math.max(1.2, view.S * 0.022), 0, TAU);
        ctx.fill();
      });
    }

    // Flash when the bridge finds its home.
    if (b.flash > 0.01) {
      ctx.save();
      ctx.globalAlpha = b.flash;
      ctx.strokeStyle = "#ffe2a5";
      ctx.lineWidth = 1.8 + b.flash * 2.2;
      ctx.shadowColor = "#ffcf7c";
      ctx.shadowBlur = 14;
      polygonPath(top);
      ctx.stroke();
      ctx.restore();
    }

    // Deck glints at the ends.
    ctx.save();
    ctx.globalAlpha = 0.55;
    ctx.fillStyle = "#ffe6b1";
    [top[0], top[1], top[2], top[3]].forEach((p, i) => {
      ctx.beginPath();
      ctx.arc(p.x, p.y, Math.max(1, view.S * 0.018), 0, TAU);
      ctx.fill();
    });
    ctx.restore();
  }

  function drawGear(b) {
    const g = gearWorld(b);
    const p = project(g.x, g.y, g.z);
    const base = project(b.cx, bridgeVisualY(b) + 0.04, b.cz);
    const active = gearInReach(b) && !playerOnBridge();
    const hover = game.hoverGear === b.id;
    const radius = clamp(view.S * 0.47, 19, 36) * (hover ? 1.09 : 1);
    const now = game.time;
    const pulse = active ? 0.74 + Math.sin(now * 3.1) * 0.14 : 0.24;

    // Invisible-looking stem.
    ctx.save();
    ctx.strokeStyle = active ? "rgba(247, 205, 132, 0.65)" : "rgba(209, 177, 132, 0.24)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(base.x, base.y);
    ctx.lineTo(p.x, p.y + radius * 0.72);
    ctx.stroke();
    ctx.restore();

    // Halo.
    const halo = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, radius * 2.2);
    halo.addColorStop(0, active ? "rgba(249, 207, 129, 0.24)" : "rgba(249, 207, 129, 0.06)");
    halo.addColorStop(0.55, active ? "rgba(229, 139, 103, 0.08)" : "rgba(229, 139, 103, 0.02)");
    halo.addColorStop(1, "rgba(229, 139, 103, 0)");
    ctx.fillStyle = halo;
    ctx.beginPath();
    ctx.arc(p.x, p.y, radius * 2.2, 0, TAU);
    ctx.fill();

    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(b.spin * 0.22);

    // Outer ring.
    ctx.shadowColor = active ? "rgba(255, 207, 122, 0.75)" : "rgba(192, 157, 107, 0.2)";
    ctx.shadowBlur = active ? 20 : 5;
    ctx.strokeStyle = active ? "rgba(255, 219, 155, 0.95)" : "rgba(217, 187, 140, 0.35)";
    ctx.lineWidth = Math.max(1.2, radius * 0.075);
    ctx.beginPath();
    ctx.arc(0, 0, radius, 0, TAU);
    ctx.stroke();

    // Inner orbit.
    ctx.shadowBlur = 0;
    ctx.strokeStyle = active ? "rgba(241, 199, 119, 0.52)" : "rgba(214, 183, 137, 0.17)";
    ctx.lineWidth = Math.max(0.8, radius * 0.032);
    ctx.beginPath();
    ctx.arc(0, 0, radius * 0.73, 0, TAU);
    ctx.stroke();

    // Spokes.
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * TAU;
      const r1 = radius * 0.27;
      const r2 = radius * 0.65;
      ctx.strokeStyle = active ? "rgba(244, 204, 134, 0.56)" : "rgba(220, 188, 140, 0.2)";
      ctx.lineWidth = Math.max(0.65, radius * 0.026);
      ctx.beginPath();
      ctx.moveTo(Math.cos(a) * r1, Math.sin(a) * r1);
      ctx.lineTo(Math.cos(a) * r2, Math.sin(a) * r2);
      ctx.stroke();
    }

    // Orbiting chevrons.
    ctx.rotate(-b.spin * 0.38);
    for (let i = 0; i < 2; i++) {
      const start = now * 0.7 + i * Math.PI;
      ctx.strokeStyle = active ? "rgba(255, 225, 166, 0.68)" : "rgba(236, 201, 141, 0.18)";
      ctx.lineWidth = Math.max(1, radius * 0.04);
      ctx.beginPath();
      ctx.arc(0, 0, radius * 1.13, start, start + 0.52);
      ctx.stroke();
    }

    // Center gem.
    ctx.rotate(b.spin * 0.16);
    const gem = radius * 0.23;
    ctx.fillStyle = active ? "#ffe0a0" : "rgba(228, 194, 139, 0.44)";
    ctx.shadowColor = active ? "#ffcf76" : "transparent";
    ctx.shadowBlur = active ? 18 : 0;
    ctx.beginPath();
    ctx.moveTo(0, -gem);
    ctx.lineTo(gem * 0.72, 0);
    ctx.lineTo(0, gem);
    ctx.lineTo(-gem * 0.72, 0);
    ctx.closePath();
    ctx.fill();

    ctx.restore();

    // Active ring pulse.
    if (active) {
      ctx.save();
      ctx.globalAlpha = 0.32 + Math.sin(now * 3.1) * 0.12;
      ctx.strokeStyle = "#ffe3aa";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(p.x, p.y, radius * 1.36, 0, TAU);
      ctx.stroke();
      ctx.restore();
    }
  }

  // ─────────────────────────────────────────────────────────────
  //  Props
  // ─────────────────────────────────────────────────────────────

  function drawTree(t) {
    const p = project(t.x, t.y, t.z);
    const h = t.h * view.S;
    const s = clamp(view.S / 62, 0.55, 1.15);
    const w = h * 0.22;
    const dark = t.hue ? "#31554f" : "#2d4b4c";
    const light = t.hue ? "#4d7c70" : "#497369";

    ctx.save();
    ctx.globalAlpha = 0.28;
    ctx.fillStyle = "#261b33";
    ctx.beginPath();
    ctx.ellipse(p.x + h * 0.06, p.y + h * 0.03, w * 0.7, w * 0.24, 0, 0, TAU);
    ctx.fill();
    ctx.restore();

    // Trunk.
    const trunkH = h * 0.34;
    ctx.strokeStyle = "rgba(213, 170, 105, 0.55)";
    ctx.lineWidth = Math.max(1, s * 1.2);
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
    ctx.lineTo(p.x, p.y - trunkH);
    ctx.stroke();

    // Spire foliage.
    const topY = p.y - h;
    const midY = p.y - h * 0.42;
    const grad = ctx.createLinearGradient(p.x - w, topY, p.x + w, p.y);
    grad.addColorStop(0, light);
    grad.addColorStop(0.55, dark);
    grad.addColorStop(1, "#213b3f");
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(p.x, topY);
    ctx.bezierCurveTo(p.x - w * 0.88, p.y - h * 0.68, p.x - w * 1.05, midY, p.x - w * 0.18, p.y - trunkH);
    ctx.quadraticCurveTo(p.x, p.y - trunkH + h * 0.035, p.x + w * 0.18, p.y - trunkH);
    ctx.bezierCurveTo(p.x + w * 1.05, midY, p.x + w * 0.88, p.y - h * 0.68, p.x, topY);
    ctx.closePath();
    ctx.fill();

    ctx.strokeStyle = "rgba(235, 196, 133, 0.32)";
    ctx.lineWidth = 0.8;
    ctx.stroke();

    // Inner leaf lines.
    ctx.strokeStyle = "rgba(178, 219, 190, 0.22)";
    ctx.beginPath();
    ctx.moveTo(p.x, topY + h * 0.12);
    ctx.quadraticCurveTo(p.x - w * 0.2, p.y - h * 0.48, p.x, p.y - trunkH);
    ctx.stroke();

    // Gold tip.
    ctx.fillStyle = "rgba(248, 205, 128, 0.8)";
    ctx.beginPath();
    ctx.arc(p.x, topY - 1, Math.max(1, s * 1.6), 0, TAU);
    ctx.fill();
  }

  function drawArch() {
    const x = 14.35;
    const baseY = 1.5;
    const zL = 5.47;
    const zR = 6.53;
    const topY = 2.18;
    const apexY = 2.78;

    const lBase = project(x, baseY, zL);
    const rBase = project(x, baseY, zR);
    const lTop = project(x, topY, zL);
    const rTop = project(x, topY, zR);
    const apex = project(x, apexY, 6.0);
    const center = project(x, 2.0, 6.0);
    const wonGlow = game.won ? 0.95 : 0.55;

    // Portal light.
    const portal = ctx.createRadialGradient(center.x, center.y, 2, center.x, center.y, view.S * 0.9);
    portal.addColorStop(0, `rgba(255, 235, 187, ${0.22 + wonGlow * 0.22})`);
    portal.addColorStop(0.45, `rgba(139, 208, 190, ${0.09 + wonGlow * 0.1})`);
    portal.addColorStop(1, "rgba(122, 186, 178, 0)");
    ctx.fillStyle = portal;
    ctx.beginPath();
    ctx.ellipse(center.x, center.y, view.S * 0.9, view.S * 1.1, 0, 0, TAU);
    ctx.fill();

    // Door interior.
    ctx.save();
    const doorGrad = ctx.createLinearGradient(lTop.x, lTop.y, rBase.x, rBase.y);
    doorGrad.addColorStop(0, "rgba(255, 234, 187, 0.20)");
    doorGrad.addColorStop(0.52, "rgba(131, 203, 190, 0.11)");
    doorGrad.addColorStop(1, "rgba(31, 34, 52, 0.28)");
    ctx.fillStyle = doorGrad;
    ctx.beginPath();
    ctx.moveTo(lBase.x, lBase.y);
    ctx.lineTo(lTop.x, lTop.y);
    ctx.quadraticCurveTo(apex.x, apex.y - view.S * 0.23, rTop.x, rTop.y);
    ctx.lineTo(rBase.x, rBase.y);
    ctx.closePath();
    ctx.fill();
    ctx.restore();

    // Pillars.
    ctx.save();
    ctx.lineCap = "round";
    ctx.shadowColor = "rgba(255, 204, 119, 0.7)";
    ctx.shadowBlur = game.won ? 26 : 12;
    ctx.strokeStyle = "rgba(247, 206, 136, 0.92)";
    ctx.lineWidth = Math.max(3, view.S * 0.09);
    ctx.beginPath();
    ctx.moveTo(lBase.x, lBase.y);
    ctx.lineTo(lTop.x, lTop.y);
    ctx.moveTo(rBase.x, rBase.y);
    ctx.lineTo(rTop.x, rTop.y);
    ctx.stroke();

    // Arch.
    ctx.lineWidth = Math.max(3, view.S * 0.085);
    ctx.beginPath();
    ctx.moveTo(lTop.x, lTop.y);
    ctx.quadraticCurveTo(apex.x, apex.y - view.S * 0.25, rTop.x, rTop.y);
    ctx.stroke();

    // Inner dark line.
    ctx.shadowBlur = 0;
    ctx.strokeStyle = "rgba(81, 55, 53, 0.44)";
    ctx.lineWidth = Math.max(1, view.S * 0.024);
    ctx.beginPath();
    ctx.moveTo(lTop.x, lTop.y);
    ctx.quadraticCurveTo(apex.x, apex.y - view.S * 0.21, rTop.x, rTop.y);
    ctx.stroke();
    ctx.restore();

    // Keystone.
    ctx.save();
    ctx.fillStyle = "rgba(255, 224, 161, 0.94)";
    ctx.shadowColor = "#ffcf79";
    ctx.shadowBlur = game.won ? 30 : 15;
    ctx.beginPath();
    ctx.moveTo(apex.x, apex.y - view.S * 0.11);
    ctx.lineTo(apex.x + view.S * 0.065, apex.y + view.S * 0.01);
    ctx.lineTo(apex.x, apex.y + view.S * 0.13);
    ctx.lineTo(apex.x - view.S * 0.065, apex.y + view.S * 0.01);
    ctx.closePath();
    ctx.fill();
    ctx.restore();

    // Pillar bases.
    [lBase, rBase].forEach(p => {
      ctx.save();
      ctx.fillStyle = "rgba(247, 206, 136, 0.72)";
      ctx.beginPath();
      ctx.ellipse(p.x, p.y, view.S * 0.085, view.S * 0.035, 0, 0, TAU);
      ctx.fill();
      ctx.restore();
    });

    // Light beam on completion.
    if (game.won) {
      const k = clamp((game.time - game.winAt) / 1.2, 0, 1);
      ctx.save();
      ctx.globalAlpha = 0.18 * k;
      const beam = ctx.createLinearGradient(center.x, center.y, center.x, center.y - view.S * 5);
      beam.addColorStop(0, "rgba(255, 231, 171, 0.9)");
      beam.addColorStop(1, "rgba(255, 231, 171, 0)");
      ctx.fillStyle = beam;
      ctx.beginPath();
      ctx.moveTo(center.x - view.S * 0.2, center.y);
      ctx.lineTo(center.x - view.S * 0.65, center.y - view.S * 5);
      ctx.lineTo(center.x + view.S * 0.65, center.y - view.S * 5);
      ctx.lineTo(center.x + view.S * 0.2, center.y);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }
  }

  // ─────────────────────────────────────────────────────────────
  //  Player
  // ─────────────────────────────────────────────────────────────

  function drawPlayer() {
    const pos = currentPlayerPosition();
    const foot = project(pos.x, pos.y + 0.06, pos.z);
    const s = clamp(view.S / 62, 0.64, 1.2);
    const bob = player.moving
      ? Math.sin(player.walkPhase * 1.1) * 1.4 * s
      : Math.sin(game.time * 2.1) * 0.55 * s;
    const sway = player.moving ? Math.sin(player.walkPhase * 0.55) * 0.035 : 0;

    // Shadow.
    ctx.save();
    ctx.globalAlpha = 0.42;
    ctx.fillStyle = "#1a1028";
    ctx.beginPath();
    ctx.ellipse(foot.x + 2 * s, foot.y + 3 * s, 11 * s, 4 * s, 0, 0, TAU);
    ctx.fill();
    ctx.restore();

    ctx.save();
    ctx.translate(foot.x, foot.y + bob);
    ctx.rotate(sway);

    // Cape / scarf behind.
    const sway2 = Math.sin(game.time * 3.2) * (player.moving ? 3.4 : 1.2) * s;
    ctx.fillStyle = "#d96f62";
    ctx.beginPath();
    ctx.moveTo(-3 * s, -24 * s);
    ctx.quadraticCurveTo((-12 - sway2) * s, -15 * s, (-10 - sway2) * s, -3 * s);
    ctx.quadraticCurveTo(-5 * s, -8 * s, 1 * s, -13 * s);
    ctx.closePath();
    ctx.fill();

    // Tiny legs.
    const stride = player.moving ? Math.sin(player.walkPhase) * 2.2 * s : 0;
    ctx.strokeStyle = "#ebdcca";
    ctx.lineWidth = 1.5 * s;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(-2.6 * s, -6 * s);
    ctx.lineTo((-2.6 + stride * 0.35) * s, 0);
    ctx.moveTo(2.6 * s, -6 * s);
    ctx.lineTo((2.6 - stride * 0.35) * s, 0);
    ctx.stroke();

    // Robe.
    const robe = ctx.createLinearGradient(-8 * s, -26 * s, 9 * s, 0);
    robe.addColorStop(0, "#fff7ea");
    robe.addColorStop(0.62, "#f0e2d0");
    robe.addColorStop(1, "#cdb9a6");
    ctx.fillStyle = robe;
    ctx.beginPath();
    ctx.moveTo(-8.2 * s, 0);
    ctx.quadraticCurveTo(-8.8 * s, -13 * s, -4.8 * s, -21 * s);
    ctx.quadraticCurveTo(-2.4 * s, -25 * s, 0, -25 * s);
    ctx.quadraticCurveTo(2.6 * s, -25 * s, 5.2 * s, -21 * s);
    ctx.quadraticCurveTo(9 * s, -12 * s, 8.2 * s, 0);
    ctx.quadraticCurveTo(0, 3 * s, -8.2 * s, 0);
    ctx.closePath();
    ctx.fill();

    ctx.strokeStyle = "rgba(106, 72, 64, 0.38)";
    ctx.lineWidth = 0.8 * s;
    ctx.stroke();

    // Robe fold.
    ctx.strokeStyle = "rgba(176, 139, 116, 0.35)";
    ctx.lineWidth = 0.7 * s;
    ctx.beginPath();
    ctx.moveTo(0.4 * s, -20 * s);
    ctx.quadraticCurveTo(-1.4 * s, -10 * s, -0.7 * s, 1 * s);
    ctx.stroke();

    // Arms.
    ctx.strokeStyle = "#f4e8d8";
    ctx.lineWidth = 2.2 * s;
    ctx.beginPath();
    ctx.moveTo(-5 * s, -19 * s);
    ctx.quadraticCurveTo(-8.4 * s, -13 * s, -7.2 * s, -8 * s);
    ctx.moveTo(5 * s, -19 * s);
    ctx.quadraticCurveTo(8.1 * s, -14 * s, 7.2 * s, -9 * s);
    ctx.stroke();

    // Neck / head.
    ctx.fillStyle = "#f6e8d7";
    ctx.beginPath();
    ctx.arc(0, -28.2 * s, 4.1 * s, 0, TAU);
    ctx.fill();
    ctx.strokeStyle = "rgba(102, 69, 64, 0.33)";
    ctx.lineWidth = 0.7 * s;
    ctx.stroke();

    // Gold collar.
    ctx.strokeStyle = "#e5b45f";
    ctx.lineWidth = 1.4 * s;
    ctx.beginPath();
    ctx.moveTo(-4.8 * s, -23.5 * s);
    ctx.quadraticCurveTo(0, -21.8 * s, 4.8 * s, -23.5 * s);
    ctx.stroke();

    // Hat.
    const hatGrad = ctx.createLinearGradient(0, -54 * s, 0, -31 * s);
    hatGrad.addColorStop(0, "#fff8ec");
    hatGrad.addColorStop(0.68, "#f0ddc6");
    hatGrad.addColorStop(1, "#ddc2a7");
    ctx.fillStyle = hatGrad;
    ctx.beginPath();
    ctx.moveTo(0, -51 * s);
    ctx.lineTo(6.5 * s, -31.5 * s);
    ctx.quadraticCurveTo(0, -29.2 * s, -6.5 * s, -31.5 * s);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = "rgba(102, 69, 64, 0.34)";
    ctx.lineWidth = 0.8 * s;
    ctx.stroke();

    // Hat band.
    ctx.strokeStyle = "#d98968";
    ctx.lineWidth = 1.5 * s;
    ctx.beginPath();
    ctx.moveTo(-5.4 * s, -34 * s);
    ctx.quadraticCurveTo(0, -32.2 * s, 5.4 * s, -34 * s);
    ctx.stroke();

    // Tiny gold tip.
    ctx.fillStyle = "#f0c270";
    ctx.beginPath();
    ctx.arc(0, -51 * s, 1.1 * s, 0, TAU);
    ctx.fill();

    ctx.restore();
  }

  function drawDestination() {
    if (!game.destination || game.won) return;
    if (player.nodeId === game.destination) return;
    const pos = nodePosition(game.destination);
    const p = project(pos.x, pos.y + 0.025, pos.z);
    const pulse = 0.55 + Math.sin(game.time * 3.6) * 0.18;
    const r = view.S * 0.26;
    ctx.save();
    ctx.globalAlpha = pulse * 0.7;
    ctx.strokeStyle = "#ffe0a2";
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(p.x, p.y - r);
    ctx.lineTo(p.x + r * 1.15, p.y);
    ctx.lineTo(p.x, p.y + r);
    ctx.lineTo(p.x - r * 1.15, p.y);
    ctx.closePath();
    ctx.stroke();
    ctx.globalAlpha = 0.14;
    ctx.fillStyle = "#ffcf7c";
    ctx.fill();
    ctx.restore();
  }

  function drawHover() {
    if (!game.hoverNode || game.won) return;
    const node = game.hoverNode;
    if (node === player.nodeId) return;
    const graph = buildGraph();
    const dist = findPathDist(graph, player.nodeId, node);
    if (dist === null) return;
    const pos = nodePosition(node);
    const p = project(pos.x, pos.y + 0.02, pos.z);
    const r = view.S * (0.34 + Math.sin(game.time * 4.2) * 0.025);
    ctx.save();
    ctx.strokeStyle = "rgba(255, 230, 178, 0.63)";
    ctx.lineWidth = 1;
    ctx.globalAlpha = 0.65;
    ctx.beginPath();
    ctx.ellipse(p.x, p.y, r * 1.12, r * 0.47, 0, 0, TAU);
    ctx.stroke();
    ctx.restore();
  }

  // ─────────────────────────────────────────────────────────────
  //  Game graph and movement
  // ─────────────────────────────────────────────────────────────

  function buildGraph() {
    const graph = new Map();
    const addNode = id => {
      if (!graph.has(id)) graph.set(id, []);
    };
    const connect = (a, b) => {
      addNode(a);
      addNode(b);
      if (!graph.get(a).includes(b)) graph.get(a).push(b);
      if (!graph.get(b).includes(a)) graph.get(b).push(a);
    };

    fixedNodes.forEach(n => addNode(n.id));
    fixedEdges.forEach(([a, b]) => connect(a, b));

    bridges.forEach(b => {
      const ids = [];
      for (let i = 0; i < b.length; i++) ids.push("bridge-" + b.id + "-" + i);
      ids.forEach(addNode);
      for (let i = 1; i < ids.length; i++) connect(ids[i - 1], ids[i]);
      if (bridgeAligned(b)) {
        connect(b.left, ids[0]);
        connect(ids[ids.length - 1], b.right);
      }
    });

    return graph;
  }

  function bfsPath(graph, start, goal) {
    if (start === goal) return [start];
    if (!graph.has(start) || !graph.has(goal)) return null;
    const queue = [start];
    const prev = new Map([[start, null]]);
    while (queue.length) {
      const cur = queue.shift();
      for (const nxt of graph.get(cur) || []) {
        if (prev.has(nxt)) continue;
        prev.set(nxt, cur);
        if (nxt === goal) {
          const path = [goal];
          let p = cur;
          while (p !== null) {
            path.push(p);
            p = prev.get(p);
          }
          path.reverse();
          return path;
        }
        queue.push(nxt);
      }
    }
    return null;
  }

  function findPathDist(graph, start, goal) {
    const path = bfsPath(graph, start, goal);
    return path ? path.length - 1 : null;
  }

  function startNextSegment() {
    if (!player.route.length) {
      player.moving = false;
      player.from = null;
      player.to = null;
      player.segT = 0;
      game.destination = null;
      checkWin();
      refreshUI(true);
      return;
    }
    const nextId = player.route.shift();
    const from = nodePosition(player.nodeId);
    const to = nodePosition(nextId);
    const dx = to.x - from.x;
    const dz = to.z - from.z;
    const dist = Math.hypot(dx, dz, (to.y - from.y) * 0.55);
    player.from = { ...from };
    player.to = { ...to, id: nextId };
    player.segT = 0;
    player.segDuration = Math.max(0.18, dist / 3.15);
    player.moving = true;
    player.walkPhase = 0;
    if (Math.abs(dx) > 0.05) player.facing = Math.sign(dx);
    refreshUI(true);
  }

  function updatePlayer(dt) {
    if (!player.moving) return;
    player.segT += dt;
    player.walkPhase += dt * 11.5;
    const raw = clamp(player.segT / player.segDuration, 0, 1);
    const t = easeInOutCubic(raw);
    player.x = lerp(player.from.x, player.to.x, t);
    player.y = lerp(player.from.y, player.to.y, t);
    player.z = lerp(player.from.z, player.to.z, t);
    if (raw >= 1) {
      const arrived = player.to.id;
      player.nodeId = arrived;
      player.x = player.to.x;
      player.y = player.to.y;
      player.z = player.to.z;
      player.steps++;
      player.reachedAt = game.time;
      Sound.step();
      burstAtWorld(player.x, player.y + 0.1, player.z, 4, true);
      if (player.route.length === 0) {
        player.moving = false;
        player.from = null;
        player.to = null;
        game.destination = null;
        checkWin();
        refreshUI(true);
      } else {
        startNextSegment();
      }
    }
  }

  function walkTo(targetId) {
    if (player.moving) {
      showToast("等她走完这一步。");
      return;
    }
    if (targetId === player.nodeId) {
      return;
    }
    const graph = buildGraph();
    const path = bfsPath(graph, player.nodeId, targetId);
    if (!path) {
      const pos = nodePosition(targetId);
      const broken = Math.abs(pos.y - player.y) > 0.2 || targetId.startsWith("bridge-")
        || (bridgeIdOfPlayer() === null && targetId !== "p0");
      showToast(broken ? "路还没有接通。" : "这里没有通往那里的路。");
      Sound.deny();
      return;
    }
    player.route = path.slice(1);
    game.destination = targetId;
    startNextSegment();
    refreshUI(true);
  }

  function checkWin() {
    if (player.nodeId === "p10" && !game.won) {
      game.won = true;
      game.winAt = game.time;
      game.destination = null;
      Sound.win();
      burstWin();
      ui.winSteps.textContent = String(player.steps);
      const secs = Math.max(0, Math.floor((performance.now() - game.startedAt) / 1000));
      ui.winTime.textContent = Math.floor(secs / 60) + ":" + String(secs % 60).padStart(2, "0");
      clearTimeout(game.winTimeout);
      game.winTimeout = setTimeout(() => {
        ui.winLayer.classList.add("show");
        ui.winLayer.setAttribute("aria-hidden", "false");
      }, 900);
      refreshUI(true);
    }
  }

  // ─────────────────────────────────────────────────────────────
  //  Gears and interactions
  // ─────────────────────────────────────────────────────────────

  function rotateBridge(b) {
    if (game.won) return;
    if (b.rotating) {
      showToast("轮盘正在转动。");
      return;
    }
    if (player.moving) {
      showToast("等她站稳，再转动轮盘。");
      Sound.deny();
      return;
    }
    if (playerOnBridge()) {
      showToast("先离开桥面，再转动它。");
      Sound.deny();
      return;
    }
    if (!gearInReach(b)) {
      showToast("金轮还太远，先走近它。");
      Sound.deny();
      return;
    }
    b.target = bridgeAligned(b) ? Math.PI / 2 : 0;
    b.rotating = true;
    game.destination = null;
    Sound.turn();
    burstGear(b, 16);
    refreshUI(true);
  }

  function updateBridges(dt) {
    for (const b of bridges) {
      b.spin += dt * (b.rotating ? 5.2 : 0.22);
      if (b.rotating) {
        const k = 1 - Math.exp(-dt * 5.8);
        b.angle += (b.target - b.angle) * k;
        if (Math.abs(b.target - b.angle) < 0.008) {
          b.angle = b.target;
          b.rotating = false;
          if (bridgeAligned(b)) {
            b.flash = 1;
            Sound.connect();
            burstGear(b, 28);
            showToast("桥面归位。");
          }
          refreshUI(true);
        }
      }
      b.flash = Math.max(0, b.flash - dt * 0.9);
      b.lastConnected = bridgeAligned(b);
    }
  }

  function clickGear(b) {
    rotateBridge(b);
  }

  function findGearAt(x, y) {
    let best = null;
    let bestD = Infinity;
    for (const b of bridges) {
      const g = gearWorld(b);
      const p = project(g.x, g.y, g.z);
      const r = Math.max(27, view.S * 0.72);
      const d = Math.hypot(x - p.x, y - p.y);
      if (d < r && d < bestD) {
        best = b;
        bestD = d;
      }
    }
    return best;
  }

  function allClickableNodes() {
    const nodes = fixedNodes.map(n => ({ id: n.id, x: n.x, y: n.y, z: n.z }));
    bridges.forEach(b => allBridgeNodes(b).forEach(n => nodes.push(n)));
    return nodes;
  }

  function findNodeAt(x, y) {
    let best = null;
    let bestD = Infinity;
    const hitR = Math.max(21, view.S * 0.62);
    for (const n of allClickableNodes()) {
      const p = project(n.x, n.y, n.z);
      const d = Math.hypot(x - p.x, y - p.y);
      if (d < hitR && d < bestD) {
        best = n.id;
        bestD = d;
      }
    }
    return best;
  }

  function onPointerDown(event) {
    if (event.button !== undefined && event.button !== 0) return;
    event.preventDefault();
    Sound.init();
    const rect = canvas.getBoundingClientRect();
    const x = event.clientX - rect.left;
    const y = event.clientY - rect.top;
    if (game.won) return;

    const b = findGearAt(x, y);
    if (b) {
      clickGear(b);
      return;
    }
    const nodeId = findNodeAt(x, y);
    if (nodeId) {
      walkTo(nodeId);
      return;
    }
    showToast("点击石板，或者靠近金轮。");
  }

  function onPointerMove(event) {
    if (event.pointerType === "touch") return;
    const rect = canvas.getBoundingClientRect();
    const x = event.clientX - rect.left;
    const y = event.clientY - rect.top;
    game.pointer.x = x;
    game.pointer.y = y;
    game.pointer.inside = true;
    const gear = findGearAt(x, y);
    const node = gear ? null : findNodeAt(x, y);
    game.hoverGear = gear ? gear.id : null;
    game.hoverNode = node;
    canvas.style.cursor = (gear || node) ? "pointer" : "default";
  }

  function onPointerLeave() {
    game.hoverGear = null;
    game.hoverNode = null;
    game.pointer.inside = false;
    canvas.style.cursor = "default";
  }

  // ─────────────────────────────────────────────────────────────
  //  Particles
  // ─────────────────────────────────────────────────────────────

  function burstAtWorld(x, y, z, count, small) {
    const p = project(x, y, z);
    for (let i = 0; i < count; i++) {
      const a = random() * TAU;
      const sp = (0.3 + random() * 0.9) * (small ? 14 : 28);
      sparkles.push({
        x: p.x,
        y: p.y - 4,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - 8,
        life: 0,
        max: 0.45 + random() * 0.65,
        r: 0.8 + random() * 2,
        color: random() > 0.5 ? "#ffe1a1" : "#e99a7c",
        gravity: small ? 16 : 28
      });
    }
  }

  function burstGear(b, count) {
    const g = gearWorld(b);
    const p = project(g.x, g.y, g.z);
    for (let i = 0; i < count; i++) {
      const a = random() * TAU;
      const sp = 18 + random() * 58;
      sparkles.push({
        x: p.x,
        y: p.y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp,
        life: 0,
        max: 0.5 + random() * 0.9,
        r: 0.7 + random() * 2.2,
        color: random() > 0.35 ? "#ffdb96" : "#83cfc0",
        gravity: 12
      });
    }
  }

  function burstWin() {
    const p = project(14.1, 2.0, 6);
    for (let i = 0; i < 90; i++) {
      const a = -Math.PI + random() * Math.PI;
      const sp = 22 + random() * 110;
      sparkles.push({
        x: p.x,
        y: p.y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp * 0.9,
        life: 0,
        max: 1.0 + random() * 1.8,
        r: 1 + random() * 3.2,
        color: random() > 0.5 ? "#ffe2a3" : (random() > 0.5 ? "#ea9478" : "#8cd2c2"),
        gravity: 12 + random() * 18
      });
    }
  }

  function updateParticles(dt) {
    for (let i = sparkles.length - 1; i >= 0; i--) {
      const p = sparkles[i];
      p.life += dt;
      if (p.life >= p.max) {
        sparkles.splice(i, 1);
        continue;
      }
      p.vy += p.gravity * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vx *= 0.988;
      p.vy *= 0.988;
    }
  }

  function drawParticles() {
    ctx.save();
    for (const p of sparkles) {
      const t = p.life / p.max;
      const alpha = Math.sin(t * Math.PI) * 0.95;
      ctx.globalAlpha = alpha;
      ctx.fillStyle = p.color;
      ctx.shadowColor = p.color;
      ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * (1 - t * 0.35), 0, TAU);
      ctx.fill();
    }
    ctx.restore();
  }

  // ─────────────────────────────────────────────────────────────
  //  UI
  // ─────────────────────────────────────────────────────────────

  function showToast(text) {
    game.toastText = text;
    game.toastUntil = game.time + 2.4;
    ui.toast.textContent = text;
    ui.toast.classList.add("show");
  }

  function computeObjective() {
    if (game.won) return "抵达拱门";
    if (!bridgeAligned(bridges[0])) return "修复断桥";
    if (!bridgeAligned(bridges[1])) return "登上高台";
    return "抵达拱门";
  }

  function computeHint() {
    if (game.won) return "回音归于寂静。";
    const a = bridges[0];
    const b = bridges[1];
    if (a.rotating) return "轮盘转动，断桥正在寻找它的位置…";
    if (b.rotating) return "第二座桥缓缓转来…";
    if (player.moving) {
      if (a.aligned && a.lastConnected && !b.rotating && player.nodeId === "p2") return "走过桥面，去往对岸。";
      return "沿着石板路前行…";
    }

    const id = player.nodeId;
    const onStart = id === "p0" || id === "p1" || id === "p2";
    const onMiddle = id === "p3" || id === "p4" || id === "p5" || id === "p6" || id === "p7" || id === "p8";
    const nearA = gearInReach(a);
    const nearB = gearInReach(b);

    if (!bridgeAligned(a)) {
      if (nearA) return "点击浮起的金色轮盘，转动断桥。";
      return "让旅人走到断桥边——金轮就在那里。";
    }
    if (onStart) return "桥面接上了。点击对岸的石板。";
    if (!bridgeAligned(b)) {
      if (nearB) return "点击高处的金色轮盘，让第二座桥归位。";
      if (onMiddle) return "沿石阶走上高台，触碰第二个轮盘。";
      return "走向高台边缘，触碰第二个轮盘。";
    }
    return "桥已接通。点击尽头的拱门。";
  }

  let lastHint = "";
  let lastObjective = "";
  let lastSteps = -1;
  let lastToastShown = false;

  function refreshUI(force) {
    const hint = computeHint();
    if (force || hint !== lastHint) {
      ui.hintText.textContent = hint;
      lastHint = hint;
      ui.hintPill.classList.toggle("active", hint.includes("轮盘") || hint.includes("点击"));
    }
    const obj = computeObjective();
    if (force || obj !== lastObjective) {
      ui.objective.textContent = obj;
      lastObjective = obj;
    }
    if (force || player.steps !== lastSteps) {
      ui.stepCount.textContent = String(player.steps).padStart(2, "0");
      lastSteps = player.steps;
    }
    const aAligned = bridgeAligned(bridges[0]);
    const bAligned = bridgeAligned(bridges[1]);
    if (ui.pips[0]) ui.pips[0].classList.toggle("done", aAligned);
    if (ui.pips[1]) ui.pips[1].classList.toggle("done", bAligned);
    if (ui.pips[2]) ui.pips[2].classList.toggle("done", game.won);

    const showToastNow = game.time < game.toastUntil;
    if (showToastNow !== lastToastShown) {
      ui.toast.classList.toggle("show", showToastNow);
      lastToastShown = showToastNow;
    }
  }

  function resetGame() {
    clearTimeout(game.winTimeout);
    game.won = false;
    game.winAt = 0;
    game.destination = null;
    game.toastUntil = 0;
    game.toastText = "";
    game.hoverNode = null;
    game.hoverGear = null;
    ui.winLayer.classList.remove("show");
    ui.winLayer.setAttribute("aria-hidden", "true");
    ui.toast.classList.remove("show");
    lastToastShown = false;

    player.nodeId = "p0";
    player.route = [];
    player.moving = false;
    player.from = null;
    player.to = null;
    player.segT = 0;
    player.segDuration = 0;
    player.x = 1;
    player.y = 0;
    player.z = 3;
    player.steps = 0;
    player.walkPhase = 0;
    player.reachedAt = 0;

    bridges.forEach(b => {
      b.angle = Math.PI / 2;
      b.target = Math.PI / 2;
      b.rotating = false;
      b.flash = 0;
      b.spin = 0;
      b.lastConnected = false;
    });
    sparkles.length = 0;
    game.startedAt = performance.now();
    refreshUI(true);
  }

  // ─────────────────────────────────────────────────────────────
  //  Main loop
  // ─────────────────────────────────────────────────────────────

  function update(dt) {
    game.time += dt;
    updateBridges(dt);
    updatePlayer(dt);
    updateParticles(dt);
    refreshUI(false);
  }

  function render() {
    ctx.clearRect(0, 0, view.w, view.h);
    drawBackground();

    // Draw platforms from back to front.
    const orderedPlatforms = [...platforms].sort((a, b) => {
      const ca = a.points.reduce((s, q) => s + q[0] + q[1], 0) / a.points.length;
      const cb = b.points.reduce((s, q) => s + q[0] + q[1], 0) / b.points.length;
      return ca - cb;
    });

    // Tall support under the upper terrace, before the platform itself.
    drawSupportColumn(8.38, 6.12, 1.38, -0.92, 0.62);

    orderedPlatforms.forEach(drawPlatform);

    drawBridgeGhost(bridges[0]);
    drawBridgeGhost(bridges[1]);
    drawBridge(bridges[0]);
    drawBridge(bridges[1]);

    // Path tiles sorted back-to-front.
    const sortedFixed = [...fixedNodes].sort((a, b) => (a.x + a.z) - (b.x + b.z));
    sortedFixed.forEach(drawTile);

    // Loose shadow pooling under bridges.
    drawDestination();

    // Props.
    const props = trees.map(t => ({ type: "tree", t, d: t.x + t.z }));
    props.sort((a, b) => a.d - b.d);
    props.forEach(p => drawTree(p.t));

    drawArch();
    drawPlayer();

    // Gear wheels float above the scene.
    bridges.forEach(drawGear);

    drawHover();
    drawParticles();
  }

  function loop(now) {
    const dt = Math.min(0.045, Math.max(0, (now - game.last) / 1000 || 0.016));
    game.last = now;
    update(dt);
    render();
    requestAnimationFrame(loop);
  }

  // ─────────────────────────────────────────────────────────────
  //  Boot
  // ─────────────────────────────────────────────────────────────

  function init() {
    resize();
    game.startedAt = performance.now();
    game.last = performance.now();
    refreshUI(true);

    window.addEventListener("resize", resize, { passive: true });
    canvas.addEventListener("pointerdown", onPointerDown, { passive: false });
    canvas.addEventListener("pointermove", onPointerMove, { passive: true });
    canvas.addEventListener("pointerleave", onPointerLeave);
    canvas.addEventListener("contextmenu", e => e.preventDefault());

    ui.soundBtn.addEventListener("click", () => {
      Sound.init();
      Sound.muted = !Sound.muted;
      ui.soundBtn.classList.toggle("muted", Sound.muted);
      ui.soundBtn.setAttribute("aria-label", Sound.muted ? "打开声音" : "关闭声音");
      if (!Sound.muted) Sound.tone(660, 0.15, "sine", 0.02, 0);
    });

    ui.replayBtn.addEventListener("click", () => {
      resetGame();
    });

    window.addEventListener("keydown", e => {
      if (e.key === "Enter" && game.won) resetGame();
      if ((e.key === "r" || e.key === "R") && !game.won) {
        const b = bridges.find(x => gearInReach(x));
        if (b) rotateBridge(b);
      }
    });

    // Tiny debug surface used by the automated play-through.
    window.__echoGame = {
      snapshot() {
        return {
          player: {
            node: player.nodeId,
            x: player.x, y: player.y, z: player.z,
            moving: player.moving, steps: player.steps
          },
          bridges: bridges.map(b => ({
            id: b.id,
            angle: b.angle,
            target: b.target,
            aligned: bridgeAligned(b),
            rotating: b.rotating
          })),
          won: game.won,
          hint: computeHint(),
          objective: computeObjective(),
          steps: player.steps
        };
      },
      screenNode(id) {
        const p = nodePosition(id);
        const s = project(p.x, p.y, p.z);
        const r = canvas.getBoundingClientRect();
        return { x: r.left + s.x, y: r.top + s.y };
      },
      screenGear(id) {
        const b = bridges.find(x => x.id === id);
        if (!b) return null;
        const g = gearWorld(b);
        const p = project(g.x, g.y, g.z);
        const r = canvas.getBoundingClientRect();
        return { x: r.left + p.x, y: r.top + p.y };
      },
      reset() { resetGame(); }
    };

    requestAnimationFrame(loop);
  }

  init();
})();
</script>
</body>
</html>
